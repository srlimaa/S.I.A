<!-- ════ LOGIN ════ -->
<div id="loginScreen">
  <div class="login-card">
    <div id="loginBrand" class="login-brand">🏛️</div>
    <h1 id="loginTitulo">Sistema de Atendimentos</h1>
    <p id="loginSub">UNILEÃO — Integração / FIES</p>
    <label>E-mail</label>
    <input type="email" id="loginEmail" placeholder="seu@email.com"/>
    <label>Senha</label>
    <div class="pw-wrap"><input type="password" id="loginSenha" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')fazerLogin()"/>
    <button type="button" class="pw-eye" id="loginEye" aria-label="Mostrar senha" title="Mostrar senha" aria-pressed="false" onclick="alternarSenha()"><svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.1 9.1 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg></button></div>
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
    <div id="loginErro"></div>
  </div>
</div>

<!-- ════ RETOMANDO A SESSÃO (ao recarregar a página) ════ -->
<div id="sessaoCarregando"><div class="sess-box"><div class="sess-spin"></div><div>Retomando sua sessão...</div></div></div>

<!-- ════ ESCOLHA DO SISTEMA ════ -->
<div id="sistemaScreen">
  <div class="sis-box">
    <h1>Qual sistema deseja acessar?</h1>
    <p class="sub" id="sisSaudacao"></p>
    <div class="sis-grid">
      <div class="sis-card" id="sisCardReg" onclick="escolherSistema('registro')">
        <div class="sis-logo" id="sisRegLogo">🏛️</div>
        <div class="sis-nome" id="sisRegNome"></div>
        <div class="sis-nota" id="sisRegNota"></div>
      </div>
      <div class="sis-card cc" id="sisCardCC" onclick="escolherSistema('cc')">
        <div class="sis-logo" id="sisCCLogo">📞</div>
        <div class="sis-nome" id="sisCCNome"></div>
        <div class="sis-nota" id="sisCCNota"></div>
      </div>
    </div>
    <button class="btn-secundario" onclick="logout()">Sair</button>
  </div>
</div>

<!-- ════ PERÍODO LETIVO ════ -->
<div id="periodoScreen">
  <div class="periodo-card">
    <h1>📅 Período Letivo</h1>
    <p class="sub" id="periodoSaudacao">Selecione o período para continuar</p>
    <label>Período</label>
    <select id="periodoSelect"></select>
    <button class="btn-login" onclick="confirmarPeriodo()">Continuar</button>
    <button class="btn-secundario" id="btnVoltarPeriodo" style="display:none;" onclick="voltarDoPeriodo()">Voltar</button>
    <div class="feedback" id="fbPeriodoSel"></div>

  </div>
</div>

<!-- ════ CALL CENTER (dentro do sistema) ════ -->
<div id="ccScreen">
  <div class="cc-bar">
    <button class="btn-logout" onclick="ccTrocarSistema()">⇄ Sistemas</button>
    <span class="cc-nome" id="ccBarNome"></span>
    <button class="btn-logout" id="ccBarPeriodo" onclick="ccTrocarPeriodo()">📅</button>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>
  <div id="ccFrameBox"><div class="cc-msg" id="ccMsg"></div></div>
</div>
