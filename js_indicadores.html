<script>
// INDICADORES (cliente): tabela por data (ou mês/semestre), atividade e colaborador, com filtros e a janela Semana.
// Os números vêm de getIndicadores (cache INDICADORES_CACHE). As funções de agrupamento e datas são reaproveitadas por Ranque e Reunião.
/* ══════════ INDICADORES ══════════ */
// Busca os indicadores do período e mostra avisos de leitura das planilhas.
function carregarIndicadores(){
  document.getElementById('indicadoresContainer').innerHTML='<p class="ind-msg">Carregando indicadores...</p>';
  google.script.run
    .withSuccessHandler(function(res){
      INDICADORES_CACHE=res;preencherFiltrosInd(res);renderIndicadores();
      var av=document.getElementById('indAvisos'),lista=(res&&res.avisos)||[];
      av.innerHTML=lista.map(function(a){return '⚠️ '+escHtml(a);}).join('<br>');
      av.style.display=lista.length?'block':'none';
    })
    .withFailureHandler(function(){
      document.getElementById('indicadoresContainer').innerHTML=
        '<p class="ind-msg" style="color:#dc2626;">Falha ao carregar indicadores.</p>';
    })
    .getIndicadores(PERIODO);
}
// Preenche os filtros de mês e colaborador com o que existe nos dados.
function preencherFiltrosInd(data){
  // Popula multi-select de Meses
  var mesesSet={};
  Object.keys(data.indicadores||{}).forEach(function(d){var m=d.split('/');mesesSet[m[1]+'/'+m[2]]=true;});
  var meses=Object.keys(mesesSet).sort(function(a,b){
    var pa=a.split('/'),pb=b.split('/');
    return new Date(pb[1],pb[0]-1)-new Date(pa[1],pa[0]-1);   // mais recente primeiro
  });
  MES_TOQUE.msMes=false;
  var ddMes=document.getElementById('msMes');
  // remove opções antigas (mantém "Todos" e separador = 2 primeiros filhos)
  while(ddMes.children.length>2)ddMes.removeChild(ddMes.lastChild);
  meses.forEach(function(m){
    var div=document.createElement('div');div.className='ms-option';
    var cb=document.createElement('input');cb.type='checkbox';cb.value=m;cb.checked=true;
    cb.addEventListener('change',function(){MES_TOQUE.msMes=true;syncMsLabel('msMes');});
    div.appendChild(cb);div.appendChild(document.createTextNode(' '+mesesLabel(m)));
    ddMes.appendChild(div);
  });
  syncMsLabel('msMes');

  // Popula multi-select de Colaboradores
  var ddColab=document.getElementById('msColab');
  while(ddColab.children.length>2)ddColab.removeChild(ddColab.lastChild);
  (data.colaboradores||[]).forEach(function(c){
    var div=document.createElement('div');div.className='ms-option';
    var cb=document.createElement('input');cb.type='checkbox';cb.value=c;cb.checked=true;
    cb.addEventListener('change',function(){syncMsLabel('msColab');});
    div.appendChild(cb);div.appendChild(document.createTextNode(' '+c));
    ddColab.appendChild(div);
  });
  syncMsLabel('msColab');

  // Atividades já estão fixas no HTML; sincroniza label
  syncMsLabel('msAtiv');
}
// Converte MM/AAAA em "Mês/AAAA" por extenso.
function mesesLabel(mmaaaa){
  var mn=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var p=mmaaaa.split('/');return mn[parseInt(p[0],10)-1]+'/'+p[1];
}
// Botão Limpar.
function limparFiltrosInd(){
  IND_SEM=false;atualizarBotaoSem('btnSemInd',false);
  document.getElementById('filtroIndDataDe').value='';
  document.getElementById('filtroIndDataAte').value='';
  setMsAll('msMes',true);
  setMsAll('msAtiv',true);
  setMsAll('msColab',true);
  renderIndicadores();
}
// Converte DD/MM/AAAA em Date.
function parseDateBR(strBR){
  var p=strBR.split('/');
  if(p.length!==3)return null;
  return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
}
// Ordem das atividades nas tabelas.
var ORDEM_ATIV=['Presencial','Ramal','E-mail','Conversa Atribuída','Conversa Fechada','Ocorrência UNILEÃO','Anexo UNILEÃO','Ocorrência UNIVS','Anexo UNIVS','Call Center'];
// Cor de cada atividade nos gráficos.
var ATIV_COR={'Presencial':'#16a34a','Ramal':'#2563eb','E-mail':'#ea580c','Conversa Atribuída':'#7c3aed','Conversa Fechada':'#db2777',
  'Ocorrência UNILEÃO':'#0891b2','Anexo UNILEÃO':'#ca8a04','Ocorrência UNIVS':'#475569','Anexo UNIVS':'#65a30d','Call Center':'#8b1e2d'};
// Datas (DD/MM/AAAA) que passam nos filtros de período e mês, da mais recente para a mais antiga
// Datas que passam nos filtros De/Até e mês, da mais recente para a mais antiga.
function datasFiltradas(ind,de,ate,meses){
  var limDe=de?new Date(de+'T00:00:00'):null,limAte=ate?new Date(ate+'T00:00:00'):null;
  return Object.keys(ind).filter(function(d){
    if(meses.length>0){var p=d.split('/');if(meses.indexOf(p[1]+'/'+p[2])===-1)return false;}
    if(limDe||limAte){
      var dt=parseDateBR(d);if(!dt)return false;
      if(limDe&&dt<limDe)return false;
      if(limAte&&dt>limAte)return false;
    }
    return true;
  }).sort(function(a,b){
    var pa=a.split('/'),pb=b.split('/');
    return new Date(pb[2],pb[1]-1,pb[0])-new Date(pa[2],pa[1]-1,pa[0]);   // mais recente primeiro
  });
}
// Controle de filtros: se o usuário mexeu nos meses; e se o modo Semestre está ligado em Indicadores e Reunião.
var MES_TOQUE={},IND_SEM=false,REU_SEM=false;
// Quantidade de meses disponíveis no filtro.
function totalMesesOpcoes(id){return document.getElementById(id).querySelectorAll('input[type=checkbox][value]').length;}
// Ordena datas DD/MM/AAAA da mais recente para a mais antiga.
function ordenarDatasDesc(l){
  return l.sort(function(a,b){var pa=a.split('/'),pb=b.split('/');return new Date(pb[2],pb[1]-1,pb[0])-new Date(pa[2],pa[1]-1,pa[0]);});
}
// Datas do semestre do período (AAAA.1 = janeiro a junho · AAAA.2 = julho a dezembro)
// Datas do semestre do período (.1 = janeiro a junho; .2 = julho a dezembro).
function datasSemestre(ind,periodo){
  var m=String(periodo||'').match(/^(\d{4})\.([12])$/);
  return ordenarDatasDesc(Object.keys(ind).filter(function(d){
    if(!m)return true;
    var p=d.split('/'),mes=parseInt(p[1],10);
    if(p[2]!==m[1])return false;
    return m[2]==='1'?(mes>=1&&mes<=6):(mes>=7&&mes<=12);
  }));
}
// Texto do semestre (ex.: julho a dezembro de 2026).
function semestreTexto(periodo){
  var m=String(periodo||'').match(/^(\d{4})\.([12])$/);
  return m?(m[2]==='1'?'janeiro a junho':'julho a dezembro')+' de '+m[1]:'';
}
// dia = uma linha por data · mes = um total por mês selecionado · semestre = um único total
// Decide se a tabela mostra um total por dia, por mês ou do semestre.
function modoAgrupamento(sem,mesesSel,totalOpc,toque){
  if(sem)return 'semestre';
  if(mesesSel.length>0&&(mesesSel.length<totalOpc||toque))return 'mes';
  return 'dia';
}
// Rótulo curto do mês (ex.: Jul/26).
function mesCurto(k){var mn=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],p=k.split('/');return mn[parseInt(p[0],10)-1]+'/'+p[1].slice(2);}
// Agrupa as datas conforme o modo (dia, mês, semestre ou semana).
function gruposDeDatas(datas,modo){
  if(modo==='semana'){                 // soma dos dias escolhidos em uma única linha por atividade
    var o=ordenarDatasDesc(datas.slice()),fim=o[0],ini=o[o.length-1],a=function(d){var p=d.split('/');return p[2]+'-'+p[1]+'-'+p[0];};
    return [{rot:ini+' a '+fim,arq:'semana_'+a(ini)+'_a_'+a(fim),curto:'Semana',datas:datas}];
  }
  if(modo==='semestre')return [{rot:PERIODO,arq:String(PERIODO),curto:String(PERIODO),datas:datas}];
  if(modo==='mes'){
    var mapa={},ordem=[];
    datas.forEach(function(d){var p=d.split('/'),k=p[1]+'/'+p[2];if(!mapa[k]){mapa[k]=[];ordem.push(k);}mapa[k].push(d);});
    return ordem.map(function(k){return {rot:mesesLabel(k),arq:k.split('/')[1]+'-'+k.split('/')[0],curto:mesCurto(k),datas:mapa[k]};});
  }
  return datas.map(function(d){return {rot:d,arq:dataArquivo(d),curto:d.slice(0,5),datas:[d]};});
}
// Títulos da primeira coluna conforme o modo.
function rotuloModo(modo){
  return modo==='mes'?{col:'Mês',titulo:'Mês'}:modo==='semestre'?{col:'Semestre',titulo:'Semestre'}:modo==='semana'?{col:'Semana',titulo:'Semana'}:{col:'Data',titulo:'Data'};
}
// Aviso exibido quando o modo é mês ou semestre.
function textoModo(modo){
  if(modo==='mes')return '📅 Mostrando o total de cada mês selecionado, sem separar por data.';
  if(modo==='semestre')return '📅 Semestre '+PERIODO+' ('+semestreTexto(PERIODO)+') em um único total.';
  return '';
}
// Lê os filtros atuais da tela.
function filtrosInd(){
  return {de:document.getElementById('filtroIndDataDe').value,ate:document.getElementById('filtroIndDataAte').value,
          meses:getMsValues('msMes'),ativs:getMsValues('msAtiv'),colabs:getMsValues('msColab'),
          sem:IND_SEM,totalMeses:totalMesesOpcoes('msMes'),toque:!!MES_TOQUE.msMes};
}
// Liga/desliga o destaque do botão Semestre.
function atualizarBotaoSem(id,on){var b=document.getElementById(id);if(b)b.classList.toggle('on',!!on);}
// Botão Filtrar.
function filtrarInd(){IND_SEM=false;atualizarBotaoSem('btnSemInd',false);renderIndicadores();}
// Botão Semestre (total do semestre inteiro).
function indSemestre(){
  IND_SEM=!IND_SEM;
  if(IND_SEM){document.getElementById('filtroIndDataDe').value='';document.getElementById('filtroIndDataAte').value='';setMsAll('msMes',true);}
  atualizarBotaoSem('btnSemInd',IND_SEM);renderIndicadores();
}
// Calcula os números da tabela de Indicadores (usado na tela, no Excel e nas imagens)
// Calcula os números da tabela; é usado na tela, no Excel e nas imagens.
function modeloIndicadores(f,forcarModo){
  var data=INDICADORES_CACHE;
  if(!data||!data.indicadores)return {vazio:'sem-dados'};
  var ind=data.indicadores,allColabs=data.colaboradores||[];
  var cols=f.colabs.length>0?allColabs.filter(function(c){return f.colabs.indexOf(c)!==-1;}):allColabs;
  var modo=forcarModo||modoAgrupamento(f.sem,f.meses,f.totalMeses,f.toque);
  var datas=f.sem?datasSemestre(ind,PERIODO):datasFiltradas(ind,f.de,f.ate,f.meses);
  if(datas.length===0||cols.length===0)return {vazio:'filtros'};
  // dias que realmente têm dados nas atividades selecionadas (é o que conta para saber se há "mais de uma data")
  var comDados=datas.filter(function(d){return ORDEM_ATIV.some(function(a){return (f.ativs.length===0||f.ativs.indexOf(a)!==-1)&&!!ind[d][a];});});
  if(modo==='semana'){if(comDados.length===0)return {vazio:'filtros'};datas=comDados;}
  var grupos=gruposDeDatas(datas,modo);
  var total={__total:0};cols.forEach(function(c){total[c]=0;});
  var dias=[];
  grupos.forEach(function(g){
    var ativs=ORDEM_ATIV.filter(function(a){
      if(f.ativs.length>0&&f.ativs.indexOf(a)===-1)return false;
      return g.datas.some(function(d){return !!ind[d][a];});
    });
    if(ativs.length===0)return;
    var sub={__total:0};cols.forEach(function(c){sub[c]=0;});
    var linhas=ativs.map(function(ativ){
      var vals={},rowT=0;
      cols.forEach(function(c){
        var v=0;
        g.datas.forEach(function(d){if(ind[d][ativ]&&ind[d][ativ][c])v+=parseInt(ind[d][ativ][c])||0;});
        vals[c]=v;sub[c]+=v;total[c]+=v;rowT+=v;
      });
      sub.__total+=rowT;total.__total+=rowT;
      return {nome:ativ,vals:vals,total:rowT};
    });
    dias.push({d:g.rot,arq:g.arq,linhas:linhas,sub:sub});
  });
  if(!dias.length)return {vazio:'filtros'};
  var rot=rotuloModo(modo);
  return {cols:cols,dias:dias,total:total,modo:modo,rotCol:rot.col,rotTitulo:rot.titulo,nDatas:comDados.length,
          ocultarTotal:(modo!=='dia'&&dias.length===1)};   // um único grupo: o "Total geral" repetiria o total do grupo
}
// Monta o HTML da tabela com subtotais e total geral.
function htmlTabelaIndicadores(m){
  var cols=m.cols;
  var html='<table class="ind-table"><thead><tr><th>'+m.rotCol+'</th><th>Atividade</th>';
  cols.forEach(function(c){html+='<th>'+c+'</th>';});
  html+='<th>Total geral</th></tr></thead><tbody>';
  m.dias.forEach(function(dia){
    dia.linhas.forEach(function(l,i){
      html+='<tr>';
      if(i===0)html+='<td class="c-data" rowspan="'+(dia.linhas.length+1)+'"><strong>'+dia.d+'</strong></td>';
      html+='<td class="c-ativ">'+l.nome+'</td>';
      cols.forEach(function(c){html+='<td>'+(l.vals[c]>0?l.vals[c]:'')+'</td>';});
      html+='<td><strong>'+(l.total>0?l.total:'')+'</strong></td></tr>';
    });
    html+='<tr class="ind-subtotal"><td class="c-ativ"><strong>'+dia.d+' Total</strong></td>';   // a célula do rótulo (rowspan) já ocupa a 1ª coluna
    cols.forEach(function(c){html+='<td><strong>'+(dia.sub[c]>0?dia.sub[c]:'')+'</strong></td>';});
    html+='<td><strong>'+dia.sub.__total+'</strong></td></tr>';
  });
  if(!m.ocultarTotal){
    html+='<tr class="ind-total"><td class="c-ativ" colspan="2">Total geral</td>';
    cols.forEach(function(c){html+='<td>'+(m.total[c]>0?m.total[c]:'')+'</td>';});
    html+='<td>'+m.total.__total+'</td></tr>';
  }
  return html+'</tbody></table>';
}
// Desenha a tabela e a janela Semana.
function renderIndicadores(){
  var cont=document.getElementById('indicadoresContainer');
  var f=filtrosInd(),m=modeloIndicadores(f);
  var info=document.getElementById('indModoInfo');
  if(m.vazio==='sem-dados'){cont.innerHTML='<p class="ind-msg">Sem dados para exibir.</p>';info.style.display='none';renderSemana(f);return;}
  if(m.vazio){cont.innerHTML='<p class="ind-msg">Nenhum dado encontrado para os filtros selecionados.</p>';info.style.display='none';renderSemana(f);return;}
  var tm=textoModo(m.modo);info.textContent=tm;info.style.display=tm?'block':'none';
  cont.innerHTML=htmlTabelaIndicadores(m);
  renderSemana(f);
}

/* ── Janela "Semana": aparece quando De/Até abrangem mais de uma data; soma os dias de cada atividade por colaborador ── */
// Retorna o modelo semanal, ou null quando a janela não se aplica
// Modelo da janela Semana (soma dos dias entre De e Até); null quando não se aplica.
function modeloSemana(f){
  if(f.sem||!(f.de||f.ate))return null;                          // só quando o filtro De/Até está em uso (não vale para Semestre)
  if(modoAgrupamento(f.sem,f.meses,f.totalMeses,f.toque)!=='dia')return null;   // com meses selecionados o total já é mensal
  var m=modeloIndicadores(f,'semana');
  return (m.vazio||m.nDatas<2)?null:m;
}
// Mostra/oculta a janela Semana e seus botões de download.
function renderSemana(f){
  var box=document.getElementById('indSemanaBox');if(!box)return;
  var m=modeloSemana(f||filtrosInd());
  if(!m){box.style.display='none';document.getElementById('indicadoresSemanaContainer').innerHTML='';document.getElementById('indSemanaDl').innerHTML='';return;}
  document.getElementById('indSemanaInfo').textContent='Soma de '+m.nDatas+' dias ('+m.dias[0].d+'), por atividade e por colaborador.';
  document.getElementById('indicadoresSemanaContainer').innerHTML=htmlTabelaIndicadores(m);
  document.getElementById('indSemanaDl').innerHTML=dlBtn('ind_semana',[
    {rot:'📗 Excel (.xlsx)',desc:'Tabela da semana, com os filtros atuais',f:baixarExcelSemana},
    {rot:'🖼️ Imagem JPG',desc:'Uma imagem com o total da semana',f:baixarImagemSemana}]);
  box.style.display='block';
}

</script>
