<script>
/* ══════════ NOME DO SISTEMA ══════════ */
var NOME_PADRAO='Sistema de Atendimentos',SUBTITULO_PADRAO='UNILEÃO — Integração / FIES';
var NOME_SISTEMA=NOME_PADRAO,SUBTITULO_LOGIN=SUBTITULO_PADRAO,NOME_LOGIN='';   // NOME_LOGIN vazio = usa NOME_SISTEMA
function aplicarNomes(){
  document.getElementById('loginTitulo').textContent=NOME_LOGIN||NOME_SISTEMA;   // só a tela de login
  var sub=document.getElementById('loginSub');
  sub.textContent=SUBTITULO_LOGIN;sub.style.display=SUBTITULO_LOGIN?'':'none';
  document.getElementById('topbarTitulo').textContent=NOME_SISTEMA;
  document.title=NOME_SISTEMA;
}
function nmIniciar(){
  document.getElementById('nmNome').value=NOME_SISTEMA;
  document.getElementById('nmSub').value=SUBTITULO_LOGIN;
  nmPreview();
}
function nmPreview(){
  var n=document.getElementById('nmNome').value.trim()||NOME_PADRAO,s=document.getElementById('nmSub').value.trim();
  document.getElementById('nmPrevTop').innerHTML='<span class="brand-icon">'+brandHTML(CFG_SISTEMA,26)+'</span><strong>'+escHtml(n)+'</strong>';
  document.getElementById('nmPrevLogo').innerHTML=brandHTML(CFG_SISTEMA,30);
  document.getElementById('nmPrevNome').textContent=n;
  document.getElementById('nmPrevSub').textContent=s;
}
function nmRestaurar(){
  document.getElementById('nmNome').value=NOME_PADRAO;
  document.getElementById('nmSub').value=SUBTITULO_PADRAO;
  nmPreview();
}
function nmSalvar(){
  var nome=document.getElementById('nmNome').value.replace(/\s+/g,' ').trim();
  var sub=document.getElementById('nmSub').value.replace(/\s+/g,' ').trim();
  if(!nome){showFeedback('fbCfg','Informe o nome do sistema.',false);return;}
  if(/[<>]/.test(nome+sub)){showFeedback('fbCfg','O texto não pode conter < ou >.',false);return;}
  var btn=document.getElementById('btnNomeSalvar');btn.disabled=true;btn.textContent='Salvando...';
  function liberar(){btn.disabled=false;btn.textContent='Salvar nome';}
  google.script.run
    .withSuccessHandler(function(r){
      liberar();
      if(!r||!r.success){showFeedback('fbCfg','Erro: '+((r&&r.message)||'sem resposta do servidor. Confira se a nova versão do script foi implantada.'),false);return;}
      NOME_SISTEMA=r.nome;SUBTITULO_LOGIN=r.subtitulo;aplicarNomes();
      showFeedback('fbCfg','✔ Nome do sistema atualizado!',true);
    })
    .withFailureHandler(function(err){liberar();showFeedback('fbCfg','Erro: '+((err&&err.message)||'falha ao conectar com o servidor.'),false);})
    .salvarNomeSistema(nome,sub,USUARIO.id);
}

/* ── Nome exclusivo da tela de login ── */
function nlIniciar(){
  document.getElementById('nlNome').value=NOME_LOGIN;
  nlPreview();
}
function nlPreview(){
  var n=document.getElementById('nlNome').value.trim()||NOME_SISTEMA;
  document.getElementById('nlPrevLogo').innerHTML=brandHTML(CFG_SISTEMA,30);
  document.getElementById('nlPrevNome').textContent=n;
  document.getElementById('nlPrevSub').textContent=SUBTITULO_LOGIN;
}
function nlRestaurar(){document.getElementById('nlNome').value='';nlPreview();}
function nlSalvar(){
  var nome=document.getElementById('nlNome').value.replace(/\s+/g,' ').trim();
  if(/[<>]/.test(nome)){showFeedback('fbCfg','O texto não pode conter < ou >.',false);return;}
  var btn=document.getElementById('btnNomeLoginSalvar');btn.disabled=true;btn.textContent='Salvando...';
  function liberar(){btn.disabled=false;btn.textContent='Salvar nome do login';}
  google.script.run
    .withSuccessHandler(function(r){
      liberar();
      if(!r||!r.success){showFeedback('fbCfg','Erro: '+((r&&r.message)||'sem resposta do servidor. Confira se a nova versão do script foi implantada.'),false);return;}
      NOME_LOGIN=(r.nome!=null?r.nome:r.nomeLogin)||'';aplicarNomes();   // aceita r.nome (NomeLogin.gs) ou r.nomeLogin
      showFeedback('fbCfg',NOME_LOGIN?'✔ Nome da tela de login atualizado!':'✔ O login voltou a usar o nome do sistema.',true);
    })
    .withFailureHandler(function(err){liberar();showFeedback('fbCfg','Erro: '+((err&&err.message)||'falha ao conectar com o servidor.'),false);})
    .salvarNomeLogin(nome,USUARIO.id);
}

</script>
