<style>
/* CSS do APP: tela de período letivo, topo, abas, cartões de tipo de registro, formulários, lista do histórico e janela (modal) de detalhe. */
  /* PERÍODO LETIVO */
  #periodoScreen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);}
  .periodo-card{background:var(--white);border-radius:16px;padding:40px;box-shadow:0 8px 32px rgba(0,0,0,.2);
    width:100%;max-width:440px;}
  .periodo-card h1{text-align:center;color:var(--titulo);font-size:22px;margin-bottom:6px;}
  .periodo-card p.sub{text-align:center;color:var(--cinza);font-size:13px;margin-bottom:24px;}
  .periodo-card label{display:block;font-size:13px;font-weight:600;color:var(--titulo);margin-bottom:6px;}
  .periodo-card input,.periodo-card select{width:100%;padding:10px 14px;border:1.5px solid var(--borda);
    border-radius:8px;font-size:14px;margin-bottom:16px;outline:none;background:var(--white);}
  .periodo-card input:focus,.periodo-card select:focus{border-color:var(--azul2);}
  .btn-secundario{width:100%;padding:10px;background:transparent;color:var(--cinza);border:1.5px solid var(--borda);
    border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;}
  .btn-secundario:hover{background:#f1f5f9;}
  .periodo-admin{margin-top:26px;padding-top:22px;border-top:1.5px dashed var(--borda);}
  .periodo-admin h3{font-size:14px;color:var(--titulo);margin-bottom:14px;}
  .btn-add-periodo{width:100%;padding:10px;background:var(--verde);color:#fff;border:none;border-radius:8px;
    font-size:14px;font-weight:600;cursor:pointer;}
  .btn-add-periodo:hover{background:#15803d;}

  /* APP */
  #appScreen{display:none;}
  .topbar{background:var(--azul);color:#fff;padding:14px 24px;display:flex;
    align-items:center;justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:0;z-index:100;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .topbar h1{font-size:17px;font-weight:700;}
  .topbar-user{font-size:13px;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px;}
  .btn-logout{background:transparent;border:1.5px solid rgba(255,255,255,.5);color:#fff;
    border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;}
  .btn-logout:hover{background:rgba(255,255,255,.15);}
  .navbar{background:var(--white);border-bottom:2px solid var(--borda2);
    display:flex;gap:4px;padding:0 24px;overflow-x:auto;}
  .nav-item{padding:13px 18px;font-size:14px;font-weight:600;color:var(--cinza);
    cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;}
  .nav-item:hover{color:var(--azul2);}
  .nav-item.active{color:var(--azul2);border-bottom-color:var(--azul2);}
  .content{padding:28px 32px;max-width:1800px;width:100%;margin:0 auto;}

  /* TIPO CARDS */
  .tipo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:16px;margin-bottom:28px;}
  .tipo-card{background:var(--white);border:2.5px solid transparent;border-radius:var(--radius);
    padding:22px 16px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:var(--shadow);}
  .tipo-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12);}
  .tipo-card.active{border-color:var(--azul2);background:#eff6ff;}
  .tipo-card .icon{font-size:32px;margin-bottom:8px;}
  .tipo-card .label{font-weight:700;font-size:14px;}
  .tipo-card.presencial:hover,.tipo-card.presencial.active{border-color:#16a34a;background:#f0fdf4;}
  .tipo-card.ramal:hover,.tipo-card.ramal.active{border-color:#2563eb;background:#eff6ff;}
  .tipo-card.email-t:hover,.tipo-card.email-t.active{border-color:#ea580c;background:#fff7ed;}
  .tipo-card.virtual:hover,.tipo-card.virtual.active{border-color:#7c3aed;background:#f5f3ff;}

  /* FORMS */
  .form-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:28px;display:none;}
  .form-card.visible{display:block;}
  .form-card h2{font-size:17px;color:var(--titulo);margin-bottom:22px;
    border-bottom:2px solid var(--borda2);padding-bottom:10px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
  @media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
  .form-group{display:flex;flex-direction:column;gap:6px;}
  .form-group.full{grid-column:1/-1;}
  .form-group label{font-size:12px;font-weight:700;color:var(--cinza);
    text-transform:uppercase;letter-spacing:.4px;}
  .form-group input,.form-group select,.form-group textarea{
    padding:9px 12px;border:1.5px solid var(--borda);border-radius:8px;
    font-size:14px;outline:none;transition:border-color .2s;background:var(--white);}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--azul2);}
  .req{color:#dc2626;margin-left:2px;}
  .btn-confirmar{margin-top:22px;padding:12px 32px;font-size:15px;font-weight:700;
    border:none;border-radius:8px;cursor:pointer;color:#fff;transition:background .2s;}
  .btn-confirmar.verde{background:#16a34a;}.btn-confirmar.verde:hover{background:#15803d;}
  .btn-confirmar.azul{background:#2563eb;}.btn-confirmar.azul:hover{background:#1d4ed8;}
  .btn-confirmar.laranja{background:#ea580c;}.btn-confirmar.laranja:hover{background:#c2410c;}
  .btn-confirmar.roxo{background:#7c3aed;}.btn-confirmar.roxo:hover{background:#6d28d9;}
  .feedback{margin-top:14px;padding:12px 16px;border-radius:8px;font-size:14px;font-weight:600;display:none;}
  .feedback.ok{background:#dcfce7;color:#166534;}
  .feedback.err{background:#fee2e2;color:#991b1b;}

  /* HISTÓRICO */
  .filtros-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .filtros-bar select,.filtros-bar input{padding:8px 12px;border:1.5px solid var(--borda);
    border-radius:8px;font-size:13px;outline:none;background:var(--white);}
  .hist-list{display:flex;flex-direction:column;gap:10px;}
  .hist-item{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px 18px;cursor:pointer;border-left:4px solid transparent;
    transition:all .2s;display:flex;align-items:center;justify-content:space-between;}
  .hist-item:hover{transform:translateX(3px);}
  .hist-item.Presencial{border-left-color:#16a34a;}
  .hist-item.Ramal{border-left-color:#2563eb;}
  .hist-item.Eemail,.hist-item.Email{border-left-color:#ea580c;}
  .hist-item.Virtual{border-left-color:#7c3aed;}
  .hist-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;color:#fff;}
  .badge-Presencial{background:#16a34a;}
  .badge-Ramal{background:#2563eb;}
  .badge-Eemail,.badge-Email{background:#ea580c;}
  .badge-Virtual{background:#7c3aed;}
  .hist-info{font-size:13px;}
  .hist-info strong{font-size:14px;}
  .hist-data{font-size:12px;color:var(--cinza);margin-top:3px;}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);
    display:none;align-items:center;justify-content:center;z-index:200;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--white);border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.2);
    padding:32px 28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;position:relative;}
  .modal-box h3{color:var(--titulo);font-size:18px;margin-bottom:18px;}
  .modal-close{position:absolute;top:16px;right:20px;font-size:22px;cursor:pointer;color:var(--cinza);}
  .modal-detalhe{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .detalhe-item{background:var(--bg);border-radius:8px;padding:10px 14px;}
  .detalhe-label{font-size:11px;font-weight:700;color:var(--cinza);text-transform:uppercase;letter-spacing:.4px;}
  .detalhe-valor{font-size:14px;margin-top:4px;}

</style>
