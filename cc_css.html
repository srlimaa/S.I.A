/* VARIÁVEIS DE COR E MEDIDA do Call Center (vermelho = cor da marca). Mude aqui para alterar o visual inteiro. */  
:root{--red:#8b1e2d;--red-light:#c04b5f;--red-dark:#5c1020;--bg:#f0f2f7;--surface:#fff;--surface2:#f7f8fc;--border:#e2e6f0;--text:#1e2535;--text-sec:#5a6480;--text-muted:#9aa3bb;--success:#1e8a4c;--success-bg:#e8f7ef;--warn:#b86e00;--warn-bg:#fff4e0;--info:#1456a0;--info-bg:#e6f0fb;--danger:#c0392b;--danger-bg:#fdecea;--header-h:58px;--radius:10px;--radius-sm:6px;--shadow:0 2px 12px rgba(30,37,53,.10);--shadow-md:0 6px 28px rgba(30,37,53,.16);--t:.18s ease;--font:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:Consolas,'Courier New',monospace}

[data-theme="dark"]{--bg:#111523;--surface:#1c2035;--surface2:#242840;--border:#2e3352;--text:#e4e8f5;--text-sec:#9aa3bb;--text-muted:#7a85a3;--shadow:0 2px 12px rgba(0,0,0,.35);--shadow-md:0 6px 28px rgba(0,0,0,.5);--success-bg:#0d2e1e;--warn-bg:#2a1e00;--info-bg:#0b1d38;--danger-bg:#2a0d0b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;transition:background var(--t),color var(--t)}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;outline:none;transition:border var(--t);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--red)}textarea{resize:vertical}input[type=checkbox]{width:auto}
/* login */
#login-screen{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,var(--red-dark) 0%,var(--red) 55%,#c04b5f 100%);display:flex;align-items:center;justify-content:center}
.login-box{background:var(--surface);border-radius:16px;padding:44px 40px;width:380px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:20px}
.login-brand{text-align:center}.logo-circle{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--red-dark),var(--red-light));display:inline-flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-weight:800;margin-bottom:10px;box-shadow:0 6px 20px rgba(139,30,45,.4);overflow:hidden}
.logo-circle.img{background:none;box-shadow:none;border-radius:0;width:auto;height:auto;max-width:200px}.logo-circle img{max-height:64px;max-width:200px;display:block}

.login-field{display:flex;flex-direction:column;gap:5px}.login-field label,.form-field label,.filter-group label,.reg-field label{font-size:11px;font-weight:600;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px}
.login-error{font-size:12px;color:var(--danger);text-align:center;min-height:14px}
.btn-login{padding:12px;background:var(--red);color:#fff;border:0;border-radius:var(--radius-sm);font-size:15px;font-weight:700;transition:background var(--t),transform var(--t)}.btn-login:hover{background:var(--red-dark);transform:translateY(-1px)}

.ms{position:relative}.msb{width:100%;text-align:left;background:var(--bg);color:var(--text);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.msb:hover{border-color:var(--red)}
