<script>
  
var T=null,ME=null,CFG={},SEMS=[],OPC={},D=null,ADMIN=false,CH={},TAB='cc';
var CC=['SOLICITADO / NÃO ADITOU','SOLICITADO / ENVIADO AO BANCO'],CC0=CC[0];
var STATUS7=['ADITOU','NÃO SOLICITADO','REJEITADO','SOLICITADO / CANCELADO','SOLICITADO / EM PROCESSAMENTO','SOLICITADO / ENVIADO AO BANCO','SOLICITADO / NÃO ADITOU'];
var PAL=['#8b1e2d','#1456a0','#1e8a4c','#b86e00','#7a3fa0','#0e8a8a','#c04b5f','#5a6480','#3a7bd5','#c0392b'];
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m,tp){var t=$('toast');t.className='toast'+(tp==='err'?' err':'');t.textContent=(tp==='err'?'⚠️ ':'✅ ')+m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},tp==='err'?5000:4000)}
function call(fn,a){return new Promise(function(res,rej){google.script.run.withSuccessHandler(function(r){
  if(r.err==='SESSAO'){sair(true);return rej('sessao')}if(r.err){toast(r.err,'err');return rej(r.err)}res(r.ok)})
  .withFailureHandler(function(e){toast(e.message,'err');rej(e)}).api(T,fn,a||{})})}
function avatar(f,n){f=f||'';if(f.indexOf('emoji:')===0)return esc(f.slice(6));if(f)return '<img src="'+esc(f)+'">';return esc((n||'?').charAt(0).toUpperCase())}
function tema(t){if(t==='Tema Escuro')document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme')}
function cnt(a,f){var o={};a.forEach(function(x){var k=f(x);o[k]=(o[k]||0)+1});return o}
function ddmm(s){return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4)}
function vt(x){return {v:x,t:x}}
function kpi(cls,ic,id,l){return '<div class="kpi-card"><div class="kpi-icon '+cls+'">'+ic+'</div><div><div class="kpi-val" id="'+id+'">—</div><div class="kpi-lbl">'+l+'</div></div></div>'}

/* ---------- multi seleção ---------- */
var MS={};
function mesOpts(ms){var anos={};ms.forEach(function(m){anos[m.slice(0,4)]=1});var multi=Object.keys(anos).length>1;return ms.map(function(m){return {v:m,t:MESES[+m.slice(5,7)-1]+(multi?'/'+m.slice(0,4):'')}})}
function msv(id){return MS[id]?MS[id].sel:[]}
function closeMs(ex){Array.prototype.forEach.call(document.querySelectorAll('.msp.on'),function(p){if(!ex||p.parentNode.id!==ex)p.classList.remove('on')})}
document.addEventListener('click',function(){closeMs()});
function msMake(id,opts,cb,blank){   // blank=true: começa em branco (sem filtro) e "Selecionar todos" marca todas as opções
  var el=$(id),prev=MS[id]?MS[id].sel:[],vals=opts.map(function(o){return o.v});
  if(blank===undefined)blank=!!(MS[id]&&MS[id].blank);
  var sel=prev.filter(function(v){return vals.indexOf(v)>=0});MS[id]={sel:sel,opts:opts,cb:cb,blank:blank};
  el.className='ms';el.innerHTML='<button type="button" class="msb"></button><div class="msp"></div>';
  var b=el.firstChild,p=el.lastChild;
  p.innerHTML='<label class="mi"><input type="checkbox" data-all="1"><b>'+(blank?'Selecionar todos':'Todos')+'</b></label>'+opts.map(function(o,i){return '<label class="mi"><input type="checkbox" data-i="'+i+'"'+(sel.indexOf(o.v)>=0?' checked':'')+'>'+esc(o.t)+'</label>'}).join('');
  var all=p.querySelector('[data-all]');
  function upd(){var s=MS[id].sel;all.checked=blank?(s.length>0&&s.length===opts.length):!s.length;var t=opts.filter(function(o){return s.indexOf(o.v)>=0}).map(function(o){return o.t});b.textContent=(!s.length?(blank?'Selecione...':'Todos'):blank&&s.length===opts.length?'Todos':t.length<=2?t.join(', '):t.length+' selecionados')+' ▾'}
  b.onclick=function(e){e.stopPropagation();closeMs(id);p.classList.toggle('on')};
  p.onclick=function(e){e.stopPropagation()};
  p.onchange=function(e){var t=e.target;if(t.getAttribute('data-all')){var on=blank&&t.checked;Array.prototype.forEach.call(p.querySelectorAll('input[data-i]'),function(c){c.checked=on});MS[id].sel=on?vals.slice():[]}
    else MS[id].sel=Array.prototype.filter.call(p.querySelectorAll('input[data-i]'),function(c){return c.checked}).map(function(c){return opts[+c.getAttribute('data-i')].v});
    upd();cb()};
  upd()}
function limpar(ms,dates,cb){ms.forEach(function(id){var m=MS[id];m.sel=[];msMake(id,m.opts,m.cb)});dates.forEach(function(id){$(id).value=''});cb()}

/* ---------- login ---------- */
function logoHtml(el,logo,txt){if(logo){el.className=el.className.replace(/\s*img/,'')+' img';el.innerHTML='<img src="'+esc(logo)+'">'}else{el.className=el.className.replace(/\s*img/,'');el.textContent=txt}}
$('lBtn').onclick=entrar;$('lSenha').onkeydown=function(e){if(e.key==='Enter')entrar()};
function entrar(){$('lErr').textContent='';$('lBtn').disabled=true;
  google.script.run.withSuccessHandler(function(r){$('lBtn').disabled=false;if(r.err){$('lErr').textContent='❌ '+r.err;return}T=r.ok.token;iniciar()})
  .withFailureHandler(function(e){$('lBtn').disabled=false;$('lErr').textContent=e.message}).apiLogin($('lEmail').value,$('lSenha').value)}
function sair(exp){parent.postMessage({ccb:1,t:exp?'sessao':'sair'},'*')}
$('bSair').onclick=function(){sair()};
function iniciar(pre){(pre&&pre.boot?Promise.resolve(pre.boot):call('boot')).then(function(b){
  ME=b.user;CFG=b.cfg;SEMS=b.sems;OPC=b.opc;ADMIN=ME.perfil==='Admin';tema(ME.tema);
  $('login-screen').style.display='none';$('app').style.display='flex';cabecalho();
  var tabs=[['cc','📞 Call Center']];if(ADMIN){tabs.push(['col','📈 Indicadores']);tabs.push(['reu','🤝 Reunião'])}
  $('nav').innerHTML=tabs.map(function(t){return '<button class="tab-btn" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('nav').style.display=ADMIN?'flex':'none';
  Array.prototype.forEach.call($('nav').children,function(b){b.onclick=function(){abaAtiva(b.dataset.t)}});
  $('bCfg').onclick=abrirCfg;$('hAv').onclick=abrirCfg;TAB='cc';
  $('bSync').onclick=function(){sincronizar(true)};
  $('bBase').style.display=ADMIN?'':'none';$('bBase').onclick=function(){toast('Recarregando a base de alunos...');carregar(true)};
  if(pre&&pre.data)aplicar(pre.data);else carregar()})}
window.__ccInit=function(m){T=m.token;iniciar(m.pre)};
function cabecalho(){$('hNome').textContent=CFG.nomeSistema||'Call Center FIES';$('hUser').textContent=ME.nome;$('hRole').textContent=ADMIN?'Administrador':'Colaborador';$('hAv').innerHTML=avatar(ME.foto,ME.nome);$('hSem').textContent='Semestre: '+ME.semestre;logoHtml($('hLogo'),CFG.logo,'CC')}
function abaAtiva(t){TAB=t;Array.prototype.forEach.call($('nav').children,function(b){b.className='tab-btn'+(b.dataset.t===t?' active':'')});
  ['cc','ger','col','reu'].forEach(function(v){$('v-'+v).className='tab-pane'+(v===t?' active':'')});if(D){if(t==='ger')renderGer();if(t==='col')renderCol();if(t==='reu'&&ADMIN)renderReu()}}
function aplicar(d){D=d;indexar();renderCC();abaAtiva(TAB);iniciarSync();marcaSync();if(ADMIN)statusSegundoPlano()}
// Datas de mudança de status (ADITOU): buscadas em segundo plano para não atrasar a abertura da tela
function statusSegundoPlano(){var sem=D.sem;google.script.run.withSuccessHandler(function(r){
  var m=r&&r.ok;if(!m||typeof m!=='object'||!D||D.sem!==sem)return;D.mud=m;(D.adit||[]).forEach(function(a){a.mud=m[a.cpf]||''});
  if(TAB==='col'&&$('adT'))adRender();else if(TAB==='reu'&&$('rcallC'))reuTudo()}).withFailureHandler(function(){}).api(T,'statusAtu',{sem:sem})}
function carregar(fresh){call('getData',{sem:ME.semestre,fresh:!!fresh}).then(aplicar).catch(function(e){D=null;$('v-cc').innerHTML='<div class="section-box"><b>Não foi possível carregar os dados deste semestre.</b><p class="muted" style="margin-top:6px">'+esc(e&&e.message?e.message:e)+'</p></div>';abaAtiva('cc')})}
// "Contato" = Sim só se o último registro for da data da solicitação do aditamento (coluna BD da Base Geral) em diante
function contatou(a){var u=D.last[a.cpf];return !!u&&(!a.solic||u.data>=a.solic)}
function indexar(){D.rmap={};D.last={};D.regs.forEach(function(r){(D.rmap[r.cpf]=D.rmap[r.cpf]||[]).push(r);var l=D.last[r.cpf];if(!l||r.data>=l.data)D.last[r.cpf]=r});D.umap={};D.ufoto={};D.usuarios.concat(D.extras||[]).forEach(function(u){D.umap[u.email]=u.nome;D.ufoto[u.email]=u.foto})}

/* ---------- atualização em tempo real ----------
   A cada ~20 s (e ao voltar para a aba) a tela faz uma chamada LEVE ao servidor com a "versão" dos dados.
   Só quando a versão mudou (alguém registrou, excluiu ou atribuiu responsável) os dados são baixados e a tela é
   atualizada no lugar, sem recarregar a página e sem perder filtros, busca ou posição da lista. */
var SYNC={t:null,busy:false,ult:0,ver:null,sig:null,pend:0};
function msSync(id,opts,cb){var m=MS[id];if(!$(id))return;if(m&&JSON.stringify(m.opts)===JSON.stringify(opts))return;msMake(id,opts,cb)}
function filtrosVivos(forca){
  var A=D.alunos,rAtv={},semResp=false,mk=forca?msMake:msSync;
  A.forEach(function(a){var e=D.resp[a.cpf];if(e)rAtv[e]=1;else semResp=true});
  mk('fR',(semResp?[{v:'-',t:'Sem responsável'}]:[]).concat(Object.keys(rAtv).map(function(e){return {v:e,t:D.umap[e]||e}})
    .sort(function(x,y){return x.t.localeCompare(y.t,'pt',{sensitivity:'base'})})),linhas);   // só responsáveis ativos
  mk('fRs',[{v:'-',t:'Sem contato'}].concat(resOpts()),linhas);
  mk('fB',Object.keys(cnt(D.regs,function(r){return r.colab})).map(function(e){return {v:e,t:D.umap[e]||e}}),linhas)}
function mesesVivos(){return mesOpts(Object.keys(cnt(D.regs,function(r){return r.data.slice(0,7)})).sort())}
function selaSync(){SYNC.sig=JSON.stringify([D.regs,D.resp,D.respDt])}      // depois de uma gravação própria: não conta como novidade de outra pessoa
function iniciarSync(){
  SYNC.ver=D.v||null;selaSync();SYNC.ult=Date.now();clearInterval(SYNC.t);
  SYNC.t=setInterval(function(){if(!document.hidden)sincronizar()},20000)}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&D)sincronizar()});
function marcaSync(){
  var d=new Date(),h=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  $('hSem').textContent='Semestre: '+ME.semestre+' · atualizado às '+h;
  var b=$('bSync');if(b)b.title='Atualizado às '+h+' — clique para atualizar agora'}
// não troca a tela de baixo de quem está usando: popup aberto, lista suspensa em uso ou atribuição em montagem
function ocupado(){
  if(document.querySelector('.ov'))return true;
  var e=document.activeElement;if(e&&(e.tagName==='SELECT'||e.tagName==='TEXTAREA')&&e.closest('#tb'))return true;
  if(ADMIN&&typeof ATR!=='undefined'&&ATR.plano)return true;
  return false}
function sincronizar(manual){
  if(!D||!T||SYNC.busy||SYNC.pend>0)return;
  SYNC.busy=true;var b=$('bSync');if(manual&&b)b.classList.add('girando');
  var forca=!!manual||(Date.now()-SYNC.ult>300000);              // a cada 5 min confere tudo, mesmo sem aviso de mudança
  function fim(){SYNC.busy=false;if(b)b.classList.remove('girando')}
  google.script.run.withSuccessHandler(function(r){
    fim();
    if(!r)return;
    if(r.err==='SESSAO'){sair(true);return}
    if(r.err||!r.ok||SYNC.pend>0)return;
    SYNC.ult=Date.now();
    if(!r.ok.regs){SYNC.ver=r.ok.v;marcaSync();if(manual)toast('Tudo já está atualizado.');return}
    if(ocupado()&&!manual)return;                                  // tenta de novo no próximo ciclo
    SYNC.ver=r.ok.v;
    var mudou=aplicarVivo(r.ok);marcaSync();
    if(manual)toast(mudou?'Dados atualizados.':'Tudo já está atualizado.')})
  .withFailureHandler(fim).api(T,'sync',{sem:ME.semestre,v:forca?'':SYNC.ver})}
function aplicarVivo(o){
  var sig=JSON.stringify([o.regs,o.resp,o.respDt]);if(sig===SYNC.sig)return false;
  SYNC.sig=sig;D.regs=o.regs;D.resp=o.resp;if(o.respDt)D.respDt=o.respDt;D.v=o.v;indexar();
  if(TAB==='cc'&&$('tb')){filtrosVivos();kpisCC();linhas()}
  else if(TAB==='ger'&&$('gc1')){var mo=mesesVivos();msSync('dM',mo,gDia);msSync('rMs',mo,gRes);gBase();gDia();gRes()}
  else if(TAB==='reu'&&$('rcallC')){reuTudo()}
  else if(TAB==='col'&&$('cK')){var mc=mesesVivos();msSync('cM',mc,cTudo);msSync('iaM',mc,iaFiltrar);msSync('cU',resOpts(),cAtu);cTudo();iaRender()}
  return true}

/* ---------- Call Center ---------- */
function dkey(s){var m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+m[2]+m[1]:String(s)}
function resOpts(){var s={};OPC.Resultado.forEach(function(x){s[x]=1});D.regs.forEach(function(r){if(r.resultado)s[r.resultado]=1});return Object.keys(s).map(vt)}
function bancoOpts(k){var s={};D.alunos.forEach(function(a){if(a.banco&&a.banco[k])s[a.banco[k]]=1});return Object.keys(s).sort(function(x,y){return dkey(x)<dkey(y)?-1:1}).map(vt)}
function bancoSet(ini,fim){if(!ini.length&&!fim.length)return null;var o={};D.alunos.forEach(function(a){if(!a.banco)return;if(ini.length&&ini.indexOf(a.banco.ini)<0)return;if(fim.length&&fim.indexOf(a.banco.fim)<0)return;o[a.cpf]=1});return o}
function nrm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
/* ---------- datas do banco: vencimento e ordenação por coluna ---------- */
function dk(s){var m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+m[2]+m[1]:''}
function hojeKey(){var d=new Date();return d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)}
function vencida(fim){var k=dk(fim);return !!k&&k<hojeKey()}
var SORT=[];   // critérios em ordem de prioridade: [{k:coluna,d:1|-1}]
var SORTV={
  status:function(a){return nrm(a.status)},
  aluno:function(a){return nrm(a.nome)},
  curso:function(a){return nrm(a.curso)+'|'+nrm(a.turno)},
  ini:function(a){return a.status===CC[1]&&a.banco?dk(a.banco.ini):''},
  fim:function(a){return a.status===CC[1]&&a.banco?dk(a.banco.fim):''}
};
function ordenar(L){
  if(!SORT.length)return L;
  var ix=L.map(function(a,i){return {a:a,i:i}});
  ix.sort(function(x,y){
    for(var s=0;s<SORT.length;s++){
      var f=SORTV[SORT[s].k],u=f(x.a),v=f(y.a);
      if(u===v)continue;
      if(u==='')return 1;if(v==='')return -1;        // vazios sempre no fim
      return SORT[s].d*(u<v?-1:1)}
    return x.i-y.i});
  return ix.map(function(o){return o.a})}
function sortClick(k){
  var i=-1;SORT.forEach(function(s,j){if(s.k===k)i=j});
  if(i===0){if(SORT[0].d===1)SORT[0].d=-1;else SORT.shift()}   // 1º clique A→Z · 2º Z→A · 3º remove
  else{if(i>0)SORT.splice(i,1);SORT.unshift({k:k,d:1})}          // a coluna clicada passa a ser a principal; as anteriores desempatam
  sortMarks();linhas()}
function sortMarks(){
  Array.prototype.forEach.call(document.querySelectorAll('#v-cc .sortable'),function(th){
    var p=-1;SORT.forEach(function(s,j){if(s.k===th.dataset.k)p=j});
    th.innerHTML=esc(th.dataset.l)+' <span class="sort-ind'+(p<0?'':' on')+'">'+(p<0?'⇅':(SORT[p].d===1?'▲':'▼')+(SORT.length>1?'<sup>'+(p+1)+'</sup>':''))+'</span>';
    th.title=p<0?'Clique para ordenar':'Ordenando ('+(SORT[p].d===1?'crescente':'decrescente')+') · clique para alternar'})}
function sortBind(){
  Array.prototype.forEach.call(document.querySelectorAll('#v-cc .sortable'),function(th){th.onclick=function(){sortClick(th.dataset.k)}});
  sortMarks()}
function renderCC(){
  var A=D.alunos,cursos=Object.keys(cnt(A,function(a){return a.curso})).sort(),colabs=Object.keys(cnt(D.regs,function(r){return r.colab}));
  $('v-cc').innerHTML='<div class="kpi-row">'+kpi('total','📋','kT','Total de alunos no<br>Call Center')+kpi('nao','⏳','kN','Solicitado /<br>Não aditou')+kpi('enviado','🏦','kE','Solicitado /<br>Enviado ao banco')+kpi('registros','📝','kR','Total de registros<br>realizados')+'</div>'+
  '<div class="filters-row"><div class="filter-group" style="min-width:220px"><label>Pesquisar aluno</label><input type="text" id="fQ" placeholder="🔍 Digite o nome do aluno..."></div><div class="filter-group"><label>Status</label><div id="fS"></div></div><div class="filter-group"><label>Curso</label><div id="fC"></div></div><div class="filter-group"><label>Responsável</label><div id="fR"></div></div><div class="filter-group"><label>Colaborador</label><div id="fB"></div></div><div class="filter-group"><label>Resultado do contato</label><div id="fRs"></div></div><div class="filter-group"><label>Data do último contato</label><input type="date" id="fDI"></div><div class="filter-group"><label>Banco — data de início</label><div id="fBI"></div></div><div class="filter-group"><label>Banco — data final</label><div id="fBF"></div></div><button class="btn-clear" id="fX">✕ Limpar</button></div>'+
  (ADMIN?atrHtml():'')+'<div class="table-window"><div class="table-window-header"><h3>Lista de Alunos</h3><span class="table-count" id="tCount"></span></div><div class="table-scroll"><table><thead><tr><th class="sortable" data-k="status" data-l="Status">Status</th><th class="sortable" data-k="aluno" data-l="Aluno">Aluno</th><th class="sortable" data-k="curso" data-l="Curso / Turno">Curso / Turno</th><th>Comparecimento ao Banco<div class="th-sub"><span class="sortable" data-k="ini" data-l="Início">Início</span> · <span class="sortable" data-k="fim" data-l="Fim">Fim</span></div></th><th>Contato</th><th>Resultado do contato</th><th>Observação</th><th>Responsável</th></tr></thead><tbody id="tb"></tbody></table></div></div>';
  msMake('fS',CC.map(vt),linhas);msMake('fC',cursos.map(vt),linhas);
  filtrosVivos(true);
  msMake('fBI',bancoOpts('ini'),linhas);msMake('fBF',bancoOpts('fim'),linhas);
  $('fQ').oninput=linhas;$('fDI').onchange=linhas;
  $('fX').onclick=function(){limpar(['fS','fC','fR','fB','fRs','fBI','fBF'],['fQ','fDI'],linhas)};if(ADMIN)atrIniciar();sortBind();kpisCC();linhas()}
function kpisCC(){var A=D.alunos;$('kT').textContent=A.length;$('kN').textContent=A.filter(function(a){return a.status===CC[0]}).length;$('kE').textContent=A.filter(function(a){return a.status===CC[1]}).length;$('kR').textContent=D.regs.length}
function filtrados(){
  var s=msv('fS'),c=msv('fC'),r=msv('fR'),b=msv('fB'),rs=msv('fRs'),bs=bancoSet(msv('fBI'),msv('fBF')),q=nrm($('fQ').value.trim()),qd=q.replace(/\D/g,''),di=$('fDI').value;
  return ordenar(D.alunos.filter(function(a){
    if(q&&nrm(a.nome).indexOf(q)<0&&!(qd&&a.cpf.indexOf(qd)>=0))return false;
    if(s.length&&s.indexOf(a.status)<0)return false;if(c.length&&c.indexOf(a.curso)<0)return false;
    if(r.length&&!r.some(function(x){return x==='-'?!D.resp[a.cpf]:D.resp[a.cpf]===x}))return false;
    if(rs.length&&!rs.some(function(x){var u=D.last[a.cpf];return x==='-'?!u:(u&&u.resultado===x)}))return false;   // pelo último resultado (o mesmo da coluna)
    if(di){var u2=D.last[a.cpf];if(!u2||u2.data.slice(0,10)!==di)return false}   // data do último contato (a mesma da coluna)
    if(b.length&&!(D.rmap[a.cpf]||[]).some(function(x){return b.indexOf(x.colab)>=0}))return false;
    if(bs&&!bs[a.cpf])return false;return true}));}
function linhas(){
  var L=filtrados();
  $('tb').innerHTML=L.map(function(a){var feito=contatou(a),env=a.status===CC[1],ul=D.last[a.cpf];
    var vc=env&&a.banco&&a.banco.fim&&vencida(a.banco.fim);
    var banco=env?(a.banco?'<div class="banco-dates"><div><span class="d-label">Início </span>'+esc(a.banco.ini)+'</div>'+(a.banco.fim?'<div class="'+(vc?'d-venc':'')+'"'+(vc?' title="Data final vencida"':'')+'><span class="d-label">Fim </span>'+esc(a.banco.fim)+'</div>':'')+'</div>':'<span class="muted">Sem informação</span>'):'<span class="muted">—</span>';

function atrAtualizar(){          // chamada a cada atualização da lista

function atrModo(){return document.querySelector('input[name=atrModo]:checked').value}
function atrAlvo(){var so=$('atrSo').checked;return filtrados().filter(function(a){return !so||!D.resp[a.cpf]})}
function atrMudou(){atrGruposRender();atrLimpaPlano()}
var ATR_ROT={curso:'cursos',turno:'turnos',status:'status'};
// Lista os valores existentes (cursos, turnos ou status) entre os alunos que entram, para marcar e escolher o responsável de cada um
function atrGruposRender(){
  var box=$('atrGrupos');if(!box)return;
  if(atrModo()!=='grupo'){box.style.display='none';return}
  box.style.display='';
  var campo=$('atrGrupo').value;
  if(ATR.campo!==campo){ATR.campo=campo;ATR.grupos={}}
  var cnt={};atrAlvo().forEach(function(a){var k=String(a[campo]||'—');cnt[k]=(cnt[k]||0)+1});
  var keys=Object.keys(cnt).sort(function(x,y){return cnt[y]-cnt[x]||x.localeCompare(y,'pt')});
  ATR.gl=keys;ATR.gc=cnt;
  keys.forEach(function(k){if(!ATR.grupos[k])ATR.grupos[k]={on:true,resp:''}});
  if(!keys.length){box.innerHTML='<span class="muted">Nenhum aluno entra com os filtros atuais.</span>';return}
  var opts=function(sel){return '<option value="">Automático</option>'+D.usuarios.map(function(u){return '<option value="'+esc(u.email)+'"'+(sel===u.email?' selected':'')+'>'+esc(u.nome)+'</option>'}).join('')};
  box.innerHTML='<div class="atr-gcab"><span class="atr-lbl">Escolha os '+ATR_ROT[campo]+' <a href="#" id="atrGAll">todos</a><a href="#" id="atrGNone">nenhum</a></span>'+
    '<span class="atr-gdef">Definir o responsável dos marcados: <select id="atrGBulk">'+opts('')+'</select> <button type="button" class="btn-secondary" id="atrGSet">Definir</button></span></div>'+
    keys.map(function(k,i){var g=ATR.grupos[k];
      return '<div class="atr-grow"><label class="atr-gnome"><input type="checkbox" data-i="'+i+'"'+(g.on?' checked':'')+'> <span>'+esc(k)+'</span> <small>('+cnt[k]+' aluno(s))</small></label>'+
             '<select data-i="'+i+'">'+opts(g.resp)+'</select></div>'}).join('')+
    '<div class="muted" id="atrGRes"></div><div class="muted">“Automático”: o sistema equilibra entre as pessoas marcadas em “Quem recebe”.</div>';
  Array.prototype.forEach.call(box.querySelectorAll('input[data-i]'),function(x){x.onchange=function(){atrGMarca(+x.getAttribute('data-i'),x.checked)}});
  Array.prototype.forEach.call(box.querySelectorAll('select[data-i]'),function(x){x.onchange=function(){atrGResp(+x.getAttribute('data-i'),x.value)}});
  $('atrGAll').onclick=function(e){e.preventDefault();atrGTodos(true)};
  $('atrGNone').onclick=function(e){e.preventDefault();atrGTodos(false)};
  $('atrGSet').onclick=function(){atrGDefinir($('atrGBulk').value)};
  atrGResumo();
}
function atrGMarca(i,on){var k=ATR.gl[i];if(k===undefined)return;ATR.grupos[k].on=!!on;atrGResumo();atrLimpaPlano()}
function atrGResp(i,email){var k=ATR.gl[i];if(k===undefined)return;ATR.grupos[k].resp=email||'';atrLimpaPlano()}
function atrGTodos(on){ATR.gl.forEach(function(k){ATR.grupos[k].on=!!on});atrGruposRender();atrLimpaPlano()}
function atrGDefinir(email){ATR.gl.forEach(function(k){if(ATR.grupos[k].on)ATR.grupos[k].resp=email||''});atrGruposRender();atrLimpaPlano()}
function atrGResumo(){
  var el=$('atrGRes');if(!el)return;
  var m=ATR.gl.filter(function(k){return ATR.grupos[k].on}),n=m.reduce(function(s,k){return s+ATR.gc[k]},0);
  el.textContent=m.length+' de '+ATR.gl.length+' marcado(s) · '+n+' aluno(s)';
}
// Monta o plano de distribuição {passos:[{email,nome,cpfs,det,antes}], total, sobra, ignorados} ou {erro}
function atrPlano(){
  var modo=atrModo(),L=filtrados();
  if(modo==='remover'){
    var rem=L.filter(function(a){return D.resp[a.cpf]});
    if(!rem.length)return {erro:'Nenhum aluno da lista tem responsável.'};
    return {modo:modo,passos:[{email:'',nome:'(sem responsável)',cpfs:rem.map(function(a){return a.cpf}),det:'',antes:0}],total:rem.length,sobra:0,ignorados:0};
  }
  var pessoas=D.usuarios.filter(function(u){return ATR.pessoas[u.email]});
  var alvo=atrAlvo();
  if(!alvo.length)return {erro:'Nenhum aluno da lista se encaixa (confira os filtros e a opção "somente alunos sem responsável").'};
  var campo=$('atrGrupo').value,gr={},sel=[],ignorados=0;
  if(modo==='grupo'){
    alvo.forEach(function(a){var k=String(a[campo]||'—');(gr[k]=gr[k]||[]).push(a.cpf)});
    sel=Object.keys(gr).filter(function(k){var g=ATR.grupos[k];return !g||g.on!==false});
    if(!sel.length)return {erro:'Marque ao menos um grupo na lista de '+ATR_ROT[campo]+'.'};
    ignorados=alvo.length-sel.reduce(function(s,k){return s+gr[k].length},0);
    var fixo=function(k){var e=ATR.grupos[k]&&ATR.grupos[k].resp;return e&&D.usuarios.some(function(u){return u.email===e})?e:''};
    if(sel.some(function(k){return !fixo(k)})&&!pessoas.length)return {erro:'Há grupos em "Automático": marque pessoas em "Quem recebe" ou escolha o responsável de cada grupo.'};
    alvo=alvo.filter(function(a){return sel.indexOf(String(a[campo]||'—'))>=0});
  }else if(!pessoas.length)return {erro:'Marque ao menos uma pessoa em "Quem recebe".'};
  var envol=pessoas.slice();                                   // marcadas + responsáveis escolhidos nos grupos
  if(modo==='grupo')sel.forEach(function(k){var e=fixo(k);if(e&&!envol.some(function(u){return u.email===e}))envol.push(D.usuarios.filter(function(u){return u.email===e})[0])});
  var emAlvo={};alvo.forEach(function(a){emAlvo[a.cpf]=1});
  var base={},peso={},por={},det={};
  envol.forEach(function(u){base[u.email]=0;por[u.email]=[];det[u.email]={}});
  D.alunos.forEach(function(a){if(!emAlvo[a.cpf]&&base[D.resp[a.cpf]]!==undefined)base[D.resp[a.cpf]]++});   // o que a pessoa já tem e não será mexido
  envol.forEach(function(u){peso[u.email]=$('atrCarga').checked?base[u.email]:0});
  function menor(){var b=pessoas[0];pessoas.forEach(function(u){if(peso[u.email]+por[u.email].length<peso[b.email]+por[b.email].length)b=u});return b}
  var sobra=0;
  if(modo==='igual'){
    alvo.forEach(function(a){por[menor().email].push(a.cpf)});
  }else if(modo==='grupo'){
    var ord=sel.slice().sort(function(x,y){return gr[y].length-gr[x].length||x.localeCompare(y,'pt')});
    ord.filter(fixo).forEach(function(k){var e=fixo(k);Array.prototype.push.apply(por[e],gr[k]);det[e][k]=gr[k].length});          // escolhidos à mão primeiro
    ord.filter(function(k){return !fixo(k)}).forEach(function(k){var u=menor();Array.prototype.push.apply(por[u.email],gr[k]);det[u.email][k]=gr[k].length});   // o resto, equilibrado
  }else{        // qtd
    var n=Math.max(1,parseInt($('atrQtd').value,10)||0),i=0;
    pessoas.forEach(function(u){por[u.email]=alvo.slice(i,i+n).map(function(a){return a.cpf});i+=n});
    sobra=Math.max(0,alvo.length-i);
  }
  var passos=envol.filter(function(u){return por[u.email].length}).map(function(u){
    return {email:u.email,nome:u.nome,cpfs:por[u.email],antes:base[u.email],det:Object.keys(det[u.email]).map(function(k){return k+' ('+det[u.email][k]+')'}).join(', ')};
  });
  return {modo:modo,passos:passos,total:passos.reduce(function(s,p){return s+p.cpfs.length},0),sobra:sobra,ignorados:ignorados};
}
function atrPrevia(){
  var p=atrPlano();atrLimpaPlano();
  if(p.erro){$('atrPrevia').innerHTML='<div class="atr-aviso">'+esc(p.erro)+'</div>';return}
  ATR.plano=p;
  var rem=p.modo==='remover';
  $('atrPrevia').innerHTML='<table class="atr-tab"><thead><tr><th>'+(rem?'Ação':'Responsável')+'</th><th>Alunos</th>'+(rem?'':'<th>Ficará com</th>')+'<th>Detalhe</th></tr></thead><tbody>'+
    p.passos.map(function(s){return '<tr><td>'+esc(s.nome)+'</td><td><b>'+s.cpfs.length+'</b></td>'+(rem?'':'<td>'+(s.antes+s.cpfs.length)+' no total</td>')+'<td class="muted">'+esc(rem?'o responsável será retirado':s.det)+'</td></tr>'}).join('')+'</tbody></table>'+
    (p.ignorados?'<div class="atr-info">'+p.ignorados+' aluno(s) de grupos desmarcados não serão alterados.</div>':'')+
    (p.sobra?'<div class="atr-aviso">'+p.sobra+' aluno(s) da lista ficam sem atribuição (aumente a quantidade por pessoa ou marque mais gente).</div>':'');
  $('atrApl').disabled=false;
  $('atrSt').textContent=p.total+' aluno(s) · '+(rem?'remoção':p.passos.length+' pessoa(s)');
}
function atrAplicar(){
  var p=ATR.plano;if(!p||!p.passos.length)return;
  var rem=p.modo==='remover';
  if(!confirm(rem?'Remover o responsável de '+p.total+' aluno(s)?':'Atribuir '+p.total+' aluno(s) a '+p.passos.length+' pessoa(s)?'))return;
  $('atrApl').disabled=true;$('atrPrev').disabled=true;SYNC.pend++;
  var feitos=0;
  function fim(ok,msg){SYNC.pend=Math.max(0,SYNC.pend-1);selaSync();$('atrPrev').disabled=false;if(ok){linhas();$('atrSt').textContent='✔ '+feitos+' aluno(s) '+(rem?'sem responsável':'atribuído(s)')+'.';toast(rem?'Responsáveis removidos.':'Responsáveis atribuídos.')}else{$('atrApl').disabled=false;$('atrSt').textContent='';toast(msg||'Falha ao atribuir.','err')}}
  (function passo(i){
    if(i>=p.passos.length){fim(true);return}
    var s=p.passos[i],partes=[];
    for(var k=0;k<s.cpfs.length;k+=2000)partes.push(s.cpfs.slice(k,k+2000));
    $('atrSt').textContent='Aplicando '+(i+1)+' de '+p.passos.length+'…';
    (function parte(j){
      if(j>=partes.length){passo(i+1);return}
      call('setRespLote',{sem:ME.semestre,cpfs:partes[j],email:s.email}).then(function(){
        partes[j].forEach(function(c){if(s.email)D.resp[c]=s.email;else delete D.resp[c]});feitos+=partes[j].length;parte(j+1);
      }).catch(function(e){fim(false,(e&&e.message)||String(e))});
    })(0);
  })(0);
}

function opcArrastar(bd,refazer){
  if(!document.getElementById('opcDragCss')){var st=document.createElement('style');st.id='opcDragCss';
    st.textContent='.opts-list .opt-item{justify-content:flex-start;gap:10px}.opt-txt{flex:1;min-width:0;overflow-wrap:anywhere}'

    +'.opt-grip i{width:3px;height:3px;border-radius:50%;background:var(--text-muted,#94a3b8)}.opt-grip:hover i{background:var(--info,#2563eb)}'
    +'.opts-list .opt-item.arr{opacity:.6;border-style:dashed;box-shadow:0 4px 14px rgba(0,0,0,.2)}.opts-list.arrastando,.opts-list.arrastando .opt-grip{cursor:grabbing}';
    document.head.appendChild(st)}
  Array.prototype.forEach.call(bd.querySelectorAll('.opts-list'),function(lista){
    var add=lista.nextSibling&&lista.nextSibling.querySelector?lista.nextSibling.querySelector('button[data-a]'):null,tipo=add?add.dataset.a:'';
    function itens(){return Array.prototype.slice.call(lista.querySelectorAll('.opt-item'))}
    Array.prototype.forEach.call(lista.querySelectorAll('.opt-grip'),function(g){
      var it=g.parentNode;
      g.addEventListener('pointerdown',function(e){
        if(e.pointerType==='mouse'&&e.button!==0)return;
        e.preventDefault();it.classList.add('arr');lista.classList.add('arrastando');
        document.addEventListener('pointermove',mov);document.addEventListener('pointerup',soltou);document.addEventListener('pointercancel',cancelou)});
      function mov(e){
        var outros=itens().filter(function(o){return o!==it}),pos=itens(),antes=pos.indexOf(it);
        var y0=lista.getBoundingClientRect().top+lista.clientTop-pos[0].offsetTop;   // posição "de layout" (ignora a animação em andamento)
        for(var i=0;i<outros.length;i++){var rt=y0+outros[i].offsetTop,rb=rt+outros[i].offsetHeight;
          if(e.clientY>=rt&&e.clientY<=rb){
            var depois=pos.indexOf(outros[i])>antes,tops=pos.map(function(o){return o.getBoundingClientRect().top});
            if(depois)lista.insertBefore(it,outros[i].nextSibling);else lista.insertBefore(it,outros[i]);
            pos.forEach(function(o,k){var d=tops[k]-o.getBoundingClientRect().top;if(!d||o===it)return;   // desliza suavemente quem foi empurrado
              o.style.transition='none';o.style.transform='translateY('+d+'px)';o.getBoundingClientRect();o.style.transition='transform .15s';o.style.transform='';});
            break}}}
      function limpa(){it.classList.remove('arr');lista.classList.remove('arrastando');
        document.removeEventListener('pointermove',mov);document.removeEventListener('pointerup',soltou);document.removeEventListener('pointercancel',cancelou)}
      function soltou(){limpa();
        var vs=Array.prototype.map.call(lista.querySelectorAll('.opt-item button[data-v]'),function(b){return b.dataset.v});
        if(vs.join('\u0001')===(OPC[tipo]||[]).join('\u0001'))return;

      function cancelou(){limpa();refazer()}
    })})}

function reuMeses(){var s={};D.regs.forEach(function(r){s[r.data.slice(0,7)]=1});Object.keys(D.respDt||{}).forEach(function(c){s[D.respDt[c].slice(0,7)]=1});return Object.keys(s).sort()}
function reuBase(){   // números "de foto" (não dependem de data)
  var aset={};D.alunos.forEach(function(a){aset[a.cpf]=1});
  var com=Object.keys(D.resp).filter(function(c){return D.resp[c]});

var REU_ON={},RF_REG=false;

// cpf -> {st,solic} de todos os alunos conhecidos (Call Center, aditados e com responsável em outros status)
function reuUni(){var u={},lm={};D.light.forEach(function(x){lm[x[3]]=x});
  var sol=function(c){return lm[c]?lm[c][4]:''};
  D.alunos.forEach(function(a){u[a.cpf]={st:a.status,solic:a.solic||sol(a.cpf)}});
  (D.adit||[]).forEach(function(a){u[a.cpf]={st:'ADITOU',solic:a.solic||sol(a.cpf)}});
  (D.outros||[]).forEach(function(o){u[o[0]]={st:o[3],solic:sol(o[0])}});

// data de referência: ADITOU = dia da mudança de status (se conhecido); demais = data da solicitação
function reuDt(c,st,solic){var d=(st==='ADITOU'&&D.mud&&D.mud[c]?D.mud[c]:solic||'').slice(0,10);return rok('rg',d)}
function reuFim(){if(RS.rg)return '';var f=$('rgF').value,m=msv('rgM'),e=f||'';if(m.length){var l=m.slice().sort().pop()+'-31';e=e&&e<l?e:l}return e}
function reuSets(){var U=reuUni(),fim=reuFim(),st=function(c){return U[c]?U[c].st:''},dt=D.respDt||{};
  var S={U:U,st:st};
  // não mudam com a data: alunos que estão hoje no Call Center
  S.al=D.alunos;S.na=S.al.filter(function(a){return a.status===CC[0]});S.eb=S.al.filter(function(a){return a.status===CC[1]});
  S.comAll=Object.keys(D.resp).filter(function(c){return D.resp[c]});
  // alunos com responsável: soma acumulada até a data final (quem recebeu responsável depois dela ainda não entra)
  S.com=S.comAll.filter(function(c){return !fim||!dt[c]||dt[c].slice(0,10)<=fim});
  var pd=function(c){return st(c)===CC[0]||st(c)===CC[1]};
  S.pendAll=S.comAll.filter(pd);S.pend=S.com.filter(pd);
  // confirmaram: ADITOU com responsável cuja mudança de status caiu no período
  S.conf=S.comAll.filter(function(c){return st(c)==='ADITOU'&&reuDt(c,'ADITOU',U[c].solic)});
  S.outr=S.com.filter(function(c){return st(c)&&[CC[0],CC[1],'ADITOU'].indexOf(st(c))<0});
  return S}
// matriz dia × coluna · uniq: 1 por CPF a cada dia (e por coluna) · senão conta registros
function reuMat(R,kf,uniq,ord){var m={},seen={},td={},tc={},tdd={};
  R.forEach(function(r){var d=r.data.slice(0,10),k=kf(r);m[d]=m[d]||{};
    if(uniq){var a=r.cpf+'|'+d;if(!tdd[a]){tdd[a]=1;td[d]=(td[d]||0)+1}a+='|'+k;if(seen[a])return;seen[a]=1}else td[d]=(td[d]||0)+1;
    m[d][k]=(m[d][k]||0)+1;tc[k]=(tc[k]||0)+1});
  var cols=Object.keys(tc).sort(function(a,b){var x=ord?ord.indexOf(a):-1,y=ord?ord.indexOf(b):-1;return(x<0?999:x)-(y<0?999:y)||String(a).localeCompare(String(b),'pt')});
  var dias=Object.keys(td).sort();return {m:m,td:td,tc:tc,cols:cols,dias:dias,tot:dias.reduce(function(s,d){return s+td[d]},0)}}

    M.dias.slice().reverse().map(function(d){return '<tr><td><b>'+ddmm(d)+'</b></td>'+M.cols.map(function(x){return '<td class="num">'+(M.m[d][x]||'')+'</td>'}).join('')+'<td class="num rf-t">'+M.td[d]+'</td></tr>'}).join('')+
    '<tr class="rf-sum"><td>Total geral</td>'+M.cols.map(function(x){return '<td class="num">'+M.tc[x]+'</td>'}).join('')+'<td class="num">'+M.tot+'</td></tr></tbody></table></div></div>'}
function reuColab(k){return D.umap[k]||k}
function reuIdx(M){return function(x,i){return RC[i%RC.length]}}
function renderReu(){
  if(!D)return;$('v-reu').classList.add('reu');var me=reuMeses();

  '<div id="reuCorpo">'+

  rSec('rcall','📞 Total Call','Clique em um cartão para abrir o indicador dele logo abaixo; clique de novo para fechar.','',dlBtn('bx_rcall','Reunião - Total Call','rgM,rgI,rgF','rcallT'),'<div class="rv-row" id="rcallC"></div><div id="rcallT" class="no-img" style="display:none"></div>')+
  '<div id="rctx"></div>'+
  rSec('rf','📅 Contatos realizados por dia','Alunos contatados em cada dia (1 por CPF); cada coluna é o total de um colaborador. O botão “Total de Registros” mostra os registros por resultado. Os filtros daqui valem só para este indicador.',fms('rfM','Mês')+fdate('rfI','Data inicial')+fdate('rfF','Data final')+'<button class="btn-clear btn-sem" id="rfS" type="button">📅 Semestre</button><button class="btn-clear rf-tg" id="rfB" type="button" title="Mostrar o total de registros por dia">Total de Registros</button><button class="btn-clear" id="rfX" type="button">✕ Limpar</button>',dlBtn('bx_rf','Reunião - Contatos realizados por dia','rgM,rgI,rgF,rfM,rfI,rfF','rfT'),'<div class="rv-box" style="margin-bottom:12px"><h4 id="rfH">📅 Total por dia</h4><div class="rv-scroll"><div class="ch" id="rfW"><canvas id="rfG2"></canvas></div></div></div><div id="rfT"></div>')+
  rSec('rb','🗓️ Responsáveis inseridos (início do Call Center)','Quantos alunos receberam responsável em cada dia (a 1ª vez que foi inserido) e o acumulado.','',dlBtn('bx_rb','Reunião - Responsáveis inseridos','rgM,rgI,rgF'),'<div class="rv-row" id="rbC"></div>')+

function reuTudo(){rBtn('rg');reuBaseG();reuCall();reuF();reuB()}
function reuBaseG(){var L=D.light.filter(function(x){return reuDt(x[3],x[0],x[4])}),cs=cnt(L,function(x){return x[0]||'(vazio)'});
  var rows=[['Total de alunos na base geral',L.length]].concat(STATUS7.map(function(s){return [s,cs[s]||0]}));

function reuCall(){var S=reuSets(),R=reuRegs(),n=function(a){return a.length};
  var at=Object.keys(cnt(R,function(r){return r.cpf+'|'+r.data.slice(0,10)})).length,dias=Object.keys(cnt(R,function(r){return r.data.slice(0,10)})).length;

function reuCtx(k,tit,S,R){var G=null,id='cT_'+k,nome=tit.replace(/[()]/g,'').slice(0,28),L=null,corpo='',ids=[id],sub='';

  else if(k==='tAc')L=[['Não Aditou',S.pendAll.filter(function(c){return S.st(c)===CC[0]}).length,1],['Enviado ao Banco',S.pendAll.filter(function(c){return S.st(c)===CC[1]}).length,7]];

  else if(k==='tAt'){var M=reuMat(R,function(r){return r.colab},true);var cA=function(x,i){return RC[i%RC.length]};corpo=(M.dias.length?reuGraf(k,'📅 Atendimentos por dia (por colaborador)'):'')+reuTabHtml(M,reuColab,cA,id,nome);G=function(){reuDesenha(k,M,reuColab,cA)};sub='Alunos atendidos em cada dia (1 por CPF); colunas = total de cada colaborador.'}

    ids=[id,id+'D'];sub='Total de cada resultado de contato e a quantidade por dia.'}
  return {g:G,ids:ids,h:rSec('c_'+k,'🔎 '+esc(tit),sub,'',dlBtn('bx_c_'+k,'Reunião - '+tit.replace(/[()]/g,''),'rgM,rgI,rgF',ids.join(',')),corpo)}}
