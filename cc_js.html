<script>
// CÓDIGO DO CALL CENTER (roda dentro do iframe de CallCenter.html).
// Estado global: T token da sessão, ME usuário, CFG configuração, SEMS semestres, OPC opções de registro, D dados do semestre (alunos, registros, responsáveis), TAB aba ativa.
// Servidor: tudo passa por call(), que chama ccApi (CallCenterApi.gs) com o token; a resposta {err} ou {ok}.
// Blocos: utilidades > seleção múltipla > login/início > atualização em tempo real > lista (Call Center) > atribuição em lote (Admin)
// > janelas > gráficos > Indicador Geral > Indicador Colaborador > Atendimentos e Alunos contatados > Configurações > download JPG/Excel.
  
// Estado global da tela (ver cabeçalho do arquivo).
var T=null,ME=null,CFG={},SEMS=[],OPC={},D=null,ADMIN=false,CH={},TAB='cc';
// Status que entram na lista de trabalho (aditamento solicitado e ainda não concluído) e a lista completa de status do banco.
var CC=['SOLICITADO / NÃO ADITOU','SOLICITADO / ENVIADO AO BANCO'],CC0=CC[0];
var STATUS7=['ADITOU','NÃO SOLICITADO','REJEITADO','SOLICITADO / CANCELADO','SOLICITADO / EM PROCESSAMENTO','SOLICITADO / ENVIADO AO BANCO','SOLICITADO / NÃO ADITOU'];
// Paleta dos gráficos.
var PAL=['#8b1e2d','#1456a0','#1e8a4c','#b86e00','#7a3fa0','#0e8a8a','#c04b5f','#5a6480','#3a7bd5','#c0392b'];
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
// Atalho para getElementById.
var $=function(id){return document.getElementById(id)};
// Escapa texto para HTML.
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
// Aviso temporário de sucesso ou erro.
function toast(m,tp){var t=$('toast');t.className='toast'+(tp==='err'?' err':'');t.textContent=(tp==='err'?'⚠️ ':'✅ ')+m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},tp==='err'?5000:4000)}
// Chamada ao servidor via ponte: trata sessão expirada (volta ao login), mostra erro em aviso e devolve uma Promise.
function call(fn,a){return new Promise(function(res,rej){google.script.run.withSuccessHandler(function(r){
  if(r.err==='SESSAO'){sair(true);return rej('sessao')}if(r.err){toast(r.err,'err');return rej(r.err)}res(r.ok)})
  .withFailureHandler(function(e){toast(e.message,'err');rej(e)}).api(T,fn,a||{})})}
// HTML da foto/emoji ou inicial do nome.
function avatar(f,n){f=f||'';if(f.indexOf('emoji:')===0)return esc(f.slice(6));if(f)return '<img src="'+esc(f)+'">';return esc((n||'?').charAt(0).toUpperCase())}
// Aplica o tema claro/escuro.
function tema(t){if(t==='Tema Escuro')document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme')}
// Conta itens por chave.
function cnt(a,f){var o={};a.forEach(function(x){var k=f(x);o[k]=(o[k]||0)+1});return o}
// Converte AAAA-MM-DD em DD/MM/AAAA.
function ddmm(s){return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4)}
// Cria opção {v, t} (valor e texto).
function vt(x){return {v:x,t:x}}
// HTML de um cartão de indicador.
function kpi(cls,ic,id,l){return '<div class="kpi-card"><div class="kpi-icon '+cls+'">'+ic+'</div><div><div class="kpi-val" id="'+id+'">—</div><div class="kpi-lbl">'+l+'</div></div></div>'}

/* ---------- multi seleção ---------- */
// Seletor múltiplo próprio do Call Center (estado por id).
var MS={};
// Opções de meses (com ano quando há mais de um).
function mesOpts(ms){var anos={};ms.forEach(function(m){anos[m.slice(0,4)]=1});var multi=Object.keys(anos).length>1;return ms.map(function(m){return {v:m,t:MESES[+m.slice(5,7)-1]+(multi?'/'+m.slice(0,4):'')}})}
// Valores selecionados de um seletor.
function msv(id){return MS[id]?MS[id].sel:[]}
// Fecha as listas abertas.
function closeMs(ex){Array.prototype.forEach.call(document.querySelectorAll('.msp.on'),function(p){if(!ex||p.parentNode.id!==ex)p.classList.remove('on')})}
document.addEventListener('click',function(){closeMs()});
// Cria o seletor múltiplo com opções e função chamada ao mudar.
function msMake(id,opts,cb){
  var el=$(id),prev=MS[id]?MS[id].sel:[],vals=opts.map(function(o){return o.v});
  var sel=prev.filter(function(v){return vals.indexOf(v)>=0});MS[id]={sel:sel,opts:opts,cb:cb};
  el.className='ms';el.innerHTML='<button type="button" class="msb"></button><div class="msp"></div>';
  var b=el.firstChild,p=el.lastChild;
  p.innerHTML='<label class="mi"><input type="checkbox" data-all="1"><b>Todos</b></label>'+opts.map(function(o,i){return '<label class="mi"><input type="checkbox" data-i="'+i+'"'+(sel.indexOf(o.v)>=0?' checked':'')+'>'+esc(o.t)+'</label>'}).join('');
  var all=p.querySelector('[data-all]');
  function upd(){var s=MS[id].sel;all.checked=!s.length;var t=opts.filter(function(o){return s.indexOf(o.v)>=0}).map(function(o){return o.t});b.textContent=(!s.length?'Todos':t.length<=2?t.join(', '):t.length+' selecionados')+' ▾'}
  b.onclick=function(e){e.stopPropagation();closeMs(id);p.classList.toggle('on')};
  p.onclick=function(e){e.stopPropagation()};
  p.onchange=function(e){var t=e.target;if(t.getAttribute('data-all')){Array.prototype.forEach.call(p.querySelectorAll('input[data-i]'),function(c){c.checked=false});MS[id].sel=[]}
    else MS[id].sel=Array.prototype.filter.call(p.querySelectorAll('input[data-i]'),function(c){return c.checked}).map(function(c){return opts[+c.getAttribute('data-i')].v});
    upd();cb()};
  upd()}
// Limpa seletores e datas e refaz a visão.
function limpar(ms,dates,cb){ms.forEach(function(id){var m=MS[id];m.sel=[];msMake(id,m.opts,m.cb)});dates.forEach(function(id){$(id).value=''});cb()}

/* ---------- login ---------- */
// Mostra o logo (imagem) ou texto.
function logoHtml(el,logo,txt){if(logo){el.className=el.className.replace(/\s*img/,'')+' img';el.innerHTML='<img src="'+esc(logo)+'">'}else{el.className=el.className.replace(/\s*img/,'');el.textContent=txt}}
$('lBtn').onclick=entrar;$('lSenha').onkeydown=function(e){if(e.key==='Enter')entrar()};
// Login interno (apiLogin), só no uso isolado.
function entrar(){$('lErr').textContent='';$('lBtn').disabled=true;
  google.script.run.withSuccessHandler(function(r){$('lBtn').disabled=false;if(r.err){$('lErr').textContent='❌ '+r.err;return}T=r.ok.token;iniciar()})
  .withFailureHandler(function(e){$('lBtn').disabled=false;$('lErr').textContent=e.message}).apiLogin($('lEmail').value,$('lSenha').value)}
// Pede ao sistema principal para sair (ou avisa sessão expirada).
function sair(exp){parent.postMessage({ccb:1,t:exp?'sessao':'sair'},'*')}
$('bSair').onclick=function(){sair()};
// Carrega configuração e opções (boot), monta as abas conforme o perfil e carrega os dados (usa os pré-carregados quando existem).
function iniciar(pre){(pre&&pre.boot?Promise.resolve(pre.boot):call('boot')).then(function(b){
  ME=b.user;CFG=b.cfg;SEMS=b.sems;OPC=b.opc;ADMIN=ME.perfil==='Admin';tema(ME.tema);
  $('login-screen').style.display='none';$('app').style.display='flex';cabecalho();
  var tabs=[['cc','📞 Call Center']];if(ADMIN){tabs.push(['ger','📊 Indicador — Geral']);tabs.push(['col','👤 Indicador — Colaborador'])}
  $('nav').innerHTML=tabs.map(function(t){return '<button class="tab-btn" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('nav').style.display=ADMIN?'flex':'none';
  Array.prototype.forEach.call($('nav').children,function(b){b.onclick=function(){abaAtiva(b.dataset.t)}});
  $('bCfg').onclick=abrirCfg;$('hAv').onclick=abrirCfg;TAB='cc';
  $('bSync').onclick=function(){sincronizar(true)};
  $('bBase').style.display=ADMIN?'':'none';$('bBase').onclick=function(){toast('Recarregando a base de alunos...');carregar(true)};
  if(pre&&pre.data)aplicar(pre.data);else carregar()})}
// Chamado pela ponte quando o sistema principal envia o token e os dados pré-carregados.
window.__ccInit=function(m){T=m.token;iniciar(m.pre)};
// Preenche nome do sistema, usuário, perfil, foto e semestre no cabeçalho.
function cabecalho(){$('hNome').textContent=CFG.nomeSistema||'Call Center FIES';$('hUser').textContent=ME.nome;$('hRole').textContent=ADMIN?'Administrador':'Colaborador';$('hAv').innerHTML=avatar(ME.foto,ME.nome);$('hSem').textContent='Semestre: '+ME.semestre;logoHtml($('hLogo'),CFG.logo,'CC')}
// Troca a aba e desenha Geral ou Colaborador ao entrar nelas.
function abaAtiva(t){TAB=t;Array.prototype.forEach.call($('nav').children,function(b){b.className='tab-btn'+(b.dataset.t===t?' active':'')});
  ['cc','ger','col'].forEach(function(v){$('v-'+v).className='tab-pane'+(v===t?' active':'')});if(D){if(t==='ger')renderGer();if(t==='col')renderCol()}}
// Recebe os dados do semestre, indexa, desenha e liga a atualização automática.
function aplicar(d){D=d;indexar();renderCC();abaAtiva(TAB);iniciarSync();marcaSync()}
// Busca os dados do semestre (getData); fresh = Admin recarrega a base de alunos da planilha.
function carregar(fresh){call('getData',{sem:ME.semestre,fresh:!!fresh}).then(aplicar).catch(function(e){D=null;$('v-cc').innerHTML='<div class="section-box"><b>Não foi possível carregar os dados deste semestre.</b><p class="muted" style="margin-top:6px">'+esc(e&&e.message?e.message:e)+'</p></div>';abaAtiva('cc')})}
// Cria índices em memória: registros por CPF, último registro, nomes e fotos por e-mail.
function indexar(){D.rmap={};D.last={};D.regs.forEach(function(r){(D.rmap[r.cpf]=D.rmap[r.cpf]||[]).push(r);var l=D.last[r.cpf];if(!l||r.data>=l.data)D.last[r.cpf]=r});D.umap={};D.ufoto={};D.usuarios.concat(D.extras||[]).forEach(function(u){D.umap[u.email]=u.nome;D.ufoto[u.email]=u.foto})}

/* ---------- atualização em tempo real ----------
   A cada ~20 s (e ao voltar para a aba) a tela faz uma chamada LEVE ao servidor com a "versão" dos dados.
   Só quando a versão mudou (alguém registrou, excluiu ou atribuiu responsável) os dados são baixados e a tela é
   atualizada no lugar, sem recarregar a página e sem perder filtros, busca ou posição da lista. */
// Estado da atualização em tempo real.
var SYNC={t:null,busy:false,ult:0,ver:null,sig:null,pend:0};
// Atualiza as opções de um seletor só quando mudaram.
function msSync(id,opts,cb){var m=MS[id];if(!$(id))return;if(m&&JSON.stringify(m.opts)===JSON.stringify(opts))return;msMake(id,opts,cb)}
// Reconstrói filtros de Responsável, Resultado e Colaborador conforme os dados atuais (responsáveis ativos).
function filtrosVivos(forca){
  var A=D.alunos,rAtv={},semResp=false,mk=forca?msMake:msSync;
  A.forEach(function(a){var e=D.resp[a.cpf];if(e)rAtv[e]=1;else semResp=true});
  mk('fR',(semResp?[{v:'-',t:'Sem responsável'}]:[]).concat(Object.keys(rAtv).map(function(e){return {v:e,t:D.umap[e]||e}})
    .sort(function(x,y){return x.t.localeCompare(y.t,'pt',{sensitivity:'base'})})),linhas);   // só responsáveis ativos
  mk('fRs',[{v:'-',t:'Sem contato'}].concat(resOpts()),linhas);
  mk('fB',Object.keys(cnt(D.regs,function(r){return r.colab})).map(function(e){return {v:e,t:D.umap[e]||e}}),linhas)}
// Meses existentes nos registros.
function mesesVivos(){return mesOpts(Object.keys(cnt(D.regs,function(r){return r.data.slice(0,7)})).sort())}
// Marca o estado atual como conhecido (após gravação própria).
function selaSync(){SYNC.sig=JSON.stringify([D.regs,D.resp])}      // depois de uma gravação própria: não conta como novidade de outra pessoa
// Liga a conferência a cada ~20 s.
function iniciarSync(){
  SYNC.ver=D.v||null;selaSync();SYNC.ult=Date.now();clearInterval(SYNC.t);
  SYNC.t=setInterval(function(){if(!document.hidden)sincronizar()},20000)}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&D)sincronizar()});
// Mostra a hora da última atualização.
function marcaSync(){
  var d=new Date(),h=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  $('hSem').textContent='Semestre: '+ME.semestre+' · atualizado às '+h;
  var b=$('bSync');if(b)b.title='Atualizado às '+h+' — clique para atualizar agora'}
// não troca a tela de baixo de quem está usando: popup aberto, lista suspensa em uso ou atribuição em montagem
// Evita atualizar a tela enquanto o usuário está com popup, lista suspensa ou atribuição em uso.
function ocupado(){
  if(document.querySelector('.ov'))return true;
  var e=document.activeElement;if(e&&(e.tagName==='SELECT'||e.tagName==='TEXTAREA')&&e.closest('#tb'))return true;
  if(ADMIN&&typeof ATR!=='undefined'&&ATR.plano)return true;
  return false}
// Pergunta ao servidor só a versão (sync); baixa os dados apenas se mudou (ou a cada 5 min, ou ao clicar em atualizar).
function sincronizar(manual){
  if(!D||!T||SYNC.busy||SYNC.pend>0)return;
  SYNC.busy=true;var b=$('bSync');if(manual&&b)b.classList.add('girando');
  var forca=!!manual||(Date.now()-SYNC.ult>300000);              // a cada 5 min confere tudo, mesmo sem aviso de mudança
  function fim(){SYNC.busy=false;if(b)b.classList.remove('girando')}
  google.script.run.withSuccessHandler(function(r){
    fim();
    if(!r)return;
    if(r.err==='SESSAO'){sair(true);return}
    if(r.err||!r.ok||SYNC.pend>0)return;
    SYNC.ult=Date.now();
    if(!r.ok.regs){SYNC.ver=r.ok.v;marcaSync();if(manual)toast('Tudo já está atualizado.');return}
    if(ocupado()&&!manual)return;                                  // tenta de novo no próximo ciclo
    SYNC.ver=r.ok.v;
    var mudou=aplicarVivo(r.ok);marcaSync();
    if(manual)toast(mudou?'Dados atualizados.':'Tudo já está atualizado.')})
  .withFailureHandler(fim).api(T,'sync',{sem:ME.semestre,v:forca?'':SYNC.ver})}
// Aplica dados novos na aba aberta sem recarregar e sem perder filtros.
function aplicarVivo(o){
  var sig=JSON.stringify([o.regs,o.resp]);if(sig===SYNC.sig)return false;
  SYNC.sig=sig;D.regs=o.regs;D.resp=o.resp;D.v=o.v;indexar();
  if(TAB==='cc'&&$('tb')){filtrosVivos();kpisCC();linhas()}
  else if(TAB==='ger'&&$('gc1')){var mo=mesesVivos();msSync('dM',mo,gDia);msSync('rMs',mo,gRes);gBase();gDia();gRes()}
  else if(TAB==='col'&&$('cK')){var mc=mesesVivos();msSync('cM',mc,cAtu);msSync('iaM',mc,iaFiltrar);msSync('cRs',resOpts(),cAtu);cAtu();iaRender()}
  return true}

/* ---------- Call Center ---------- */
// Chave de ordenação de datas.
function dkey(s){var m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+m[2]+m[1]:String(s)}
// Opções de resultado do contato (cadastradas e as usadas nos registros).
function resOpts(){var s={};OPC.Resultado.forEach(function(x){s[x]=1});D.regs.forEach(function(r){if(r.resultado)s[r.resultado]=1});return Object.keys(s).map(vt)}
// Opções de início/fim do banco, ordenadas por data.
function bancoOpts(k){var s={};D.alunos.forEach(function(a){if(a.banco&&a.banco[k])s[a.banco[k]]=1});return Object.keys(s).sort(function(x,y){return dkey(x)<dkey(y)?-1:1}).map(vt)}
// Conjunto de CPFs cujo período do banco coincide com o filtro.
function bancoSet(ini,fim){if(!ini.length&&!fim.length)return null;var o={};D.alunos.forEach(function(a){if(!a.banco)return;if(ini.length&&ini.indexOf(a.banco.ini)<0)return;if(fim.length&&fim.indexOf(a.banco.fim)<0)return;o[a.cpf]=1});return o}
// Normaliza texto (sem acento, minúsculas) para busca.
function nrm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
/* ---------- datas do banco: vencimento e ordenação por coluna ---------- */
// Data DD/MM/AAAA em AAAAMMDD.
function dk(s){var m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+m[2]+m[1]:''}
// Data de hoje em AAAAMMDD.
function hojeKey(){var d=new Date();return d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)}
// Data final do banco vencida (destacada em vermelho).
function vencida(fim){var k=dk(fim);return !!k&&k<hojeKey()}
// Ordenação por clique nas colunas (vários critérios).
var SORT=[];   // critérios em ordem de prioridade: [{k:coluna,d:1|-1}]
// Como obter o valor de cada coluna para ordenar.
var SORTV={
  status:function(a){return nrm(a.status)},
  aluno:function(a){return nrm(a.nome)},
  curso:function(a){return nrm(a.curso)+'|'+nrm(a.turno)},
  ini:function(a){return a.status===CC[1]&&a.banco?dk(a.banco.ini):''},
  fim:function(a){return a.status===CC[1]&&a.banco?dk(a.banco.fim):''}
};
// Ordena a lista pelos critérios.
function ordenar(L){
  if(!SORT.length)return L;
  var ix=L.map(function(a,i){return {a:a,i:i}});
  ix.sort(function(x,y){
    for(var s=0;s<SORT.length;s++){
      var f=SORTV[SORT[s].k],u=f(x.a),v=f(y.a);
      if(u===v)continue;
      if(u==='')return 1;if(v==='')return -1;        // vazios sempre no fim
      return SORT[s].d*(u<v?-1:1)}
    return x.i-y.i});
  return ix.map(function(o){return o.a})}
// Clique no cabeçalho de coluna.
function sortClick(k){
  var i=-1;SORT.forEach(function(s,j){if(s.k===k)i=j});
  if(i===0){if(SORT[0].d===1)SORT[0].d=-1;else SORT.shift()}   // 1º clique A→Z · 2º Z→A · 3º remove
  else{if(i>0)SORT.splice(i,1);SORT.unshift({k:k,d:1})}          // a coluna clicada passa a ser a principal; as anteriores desempatam
  sortMarks();linhas()}
// Mostra as setas de ordenação.
function sortMarks(){
  Array.prototype.forEach.call(document.querySelectorAll('#v-cc .sortable'),function(th){
    var p=-1;SORT.forEach(function(s,j){if(s.k===th.dataset.k)p=j});
    th.innerHTML=esc(th.dataset.l)+' <span class="sort-ind'+(p<0?'':' on')+'">'+(p<0?'⇅':(SORT[p].d===1?'▲':'▼')+(SORT.length>1?'<sup>'+(p+1)+'</sup>':''))+'</span>';
    th.title=p<0?'Clique para ordenar':'Ordenando ('+(SORT[p].d===1?'crescente':'decrescente')+') · clique para alternar'})}
// Liga os cliques dos cabeçalhos.
function sortBind(){
  Array.prototype.forEach.call(document.querySelectorAll('#v-cc .sortable'),function(th){th.onclick=function(){sortClick(th.dataset.k)}});
  sortMarks()}
// Desenha a aba Call Center: cartões, filtros, atribuição (Admin) e lista.
function renderCC(){
  var A=D.alunos,cursos=Object.keys(cnt(A,function(a){return a.curso})).sort(),colabs=Object.keys(cnt(D.regs,function(r){return r.colab}));
  $('v-cc').innerHTML='<div class="kpi-row">'+kpi('total','📋','kT','Total de alunos no<br>Call Center')+kpi('nao','⏳','kN','Solicitado /<br>Não aditou')+kpi('enviado','🏦','kE','Solicitado /<br>Enviado ao banco')+kpi('registros','📝','kR','Total de registros<br>realizados')+'</div>'+
  '<div class="filters-row"><div class="filter-group" style="min-width:220px"><label>Pesquisar aluno</label><input type="text" id="fQ" placeholder="🔍 Digite o nome do aluno..."></div><div class="filter-group"><label>Status</label><div id="fS"></div></div><div class="filter-group"><label>Curso</label><div id="fC"></div></div><div class="filter-group"><label>Responsável</label><div id="fR"></div></div><div class="filter-group"><label>Colaborador</label><div id="fB"></div></div><div class="filter-group"><label>Resultado do contato</label><div id="fRs"></div></div><div class="filter-group"><label>Data do último contato</label><input type="date" id="fDI"></div><div class="filter-group"><label>Banco — data de início</label><div id="fBI"></div></div><div class="filter-group"><label>Banco — data final</label><div id="fBF"></div></div><button class="btn-clear" id="fX">✕ Limpar</button></div>'+
  (ADMIN?atrHtml():'')+'<div class="table-window"><div class="table-window-header"><h3>Lista de Alunos</h3><span class="table-count" id="tCount"></span></div><div class="table-scroll"><table><thead><tr><th class="sortable" data-k="status" data-l="Status">Status</th><th class="sortable" data-k="aluno" data-l="Aluno">Aluno</th><th class="sortable" data-k="curso" data-l="Curso / Turno">Curso / Turno</th><th>Comparecimento ao Banco<div class="th-sub"><span class="sortable" data-k="ini" data-l="Início">Início</span> · <span class="sortable" data-k="fim" data-l="Fim">Fim</span></div></th><th>Contato</th><th>Resultado do contato</th><th>Observação</th><th>Responsável</th></tr></thead><tbody id="tb"></tbody></table></div></div>';
  msMake('fS',CC.map(vt),linhas);msMake('fC',cursos.map(vt),linhas);
  filtrosVivos(true);
  msMake('fBI',bancoOpts('ini'),linhas);msMake('fBF',bancoOpts('fim'),linhas);

// Atualiza os cartões (total, não aditou, enviado ao banco...).
function kpisCC(){var A=D.alunos;$('kT').textContent=A.length;$('kN').textContent=A.filter(function(a){return a.status===CC[0]}).length;$('kE').textContent=A.filter(function(a){return a.status===CC[1]}).length;$('kR').textContent=D.regs.length}
// Alunos que passam em todos os filtros.
function filtrados(){
  var s=msv('fS'),c=msv('fC'),r=msv('fR'),b=msv('fB'),rs=msv('fRs'),bs=bancoSet(msv('fBI'),msv('fBF')),q=nrm($('fQ').value.trim()),qd=q.replace(/\D/g,''),di=$('fDI').value;
  return ordenar(D.alunos.filter(function(a){

    if(s.length&&s.indexOf(a.status)<0)return false;if(c.length&&c.indexOf(a.curso)<0)return false;
    if(r.length&&!r.some(function(x){return x==='-'?!D.resp[a.cpf]:D.resp[a.cpf]===x}))return false;
    if(rs.length&&!rs.some(function(x){var u=D.last[a.cpf];return x==='-'?!u:(u&&u.resultado===x)}))return false;   // pelo último resultado (o mesmo da coluna)
    if(di){var u2=D.last[a.cpf];if(!u2||u2.data.slice(0,10)!==di)return false}   // data do último contato (a mesma da coluna)
    if(b.length&&!(D.rmap[a.cpf]||[]).some(function(x){return b.indexOf(x.colab)>=0}))return false;
    if(bs&&!bs[a.cpf])return false;return true}));}

      :(D.resp[a.cpf]?'<span class="resp-nome">'+esc(D.umap[D.resp[a.cpf]]||D.resp[a.cpf])+'</span>':'<span class="muted">—</span>'))+'</td></tr>'}).join('');
  $('tCount').textContent=L.length+' aluno(s)';

// Abre/prepara o painel.
function atrIniciar(){

  abrir();

  $('atrTodos').onclick=function(e){e.preventDefault();e.stopPropagation();D.usuarios.forEach(function(u){ATR.pessoas[u.email]=true});atrPessoas();atrLimpaPlano()};

// Quantos alunos cada responsável já tem.
function atrCarga(){var c={};Object.keys(D.resp).forEach(function(k){if(D.resp[k])c[D.resp[k]]=(c[D.resp[k]]||0)+1});return c}
// Pessoas disponíveis para receber alunos.
function atrPessoas(){
  var c=atrCarga();
  $('atrPessoas').innerHTML=D.usuarios.map(function(u){return '<label class="atr-chip'+(ATR.pessoas[u.email]?' on':'')+'"><input type="checkbox" data-e="'+esc(u.email)+'"'+(ATR.pessoas[u.email]?' checked':'')+'> '+esc(u.nome)+' <small>('+(c[u.email]||0)+')</small></label>'}).join('')||'<span class="muted">Nenhum usuário com acesso ao Call Center.</span>';
  Array.prototype.forEach.call($('atrPessoas').querySelectorAll('input'),function(x){x.onchange=function(){if(x.checked)ATR.pessoas[x.getAttribute('data-e')]=true;else delete ATR.pessoas[x.getAttribute('data-e')];x.parentNode.className='atr-chip'+(x.checked?' on':'');atrLimpaPlano()}});
}
// Descarta o plano calculado ao mudar algo.
function atrLimpaPlano(){
  ATR.plano=null;
  if($('atrApl'))$('atrApl').disabled=true;
  if($('atrPrevia'))$('atrPrevia').innerHTML='';
}
// Reajusta o painel a cada atualização da lista.
function atrAtualizar(){          // chamada a cada atualização da lista
  if(!ADMIN||!$('atrRes'))return;
  var L=filtrados();
  $('atrRes').textContent=L.length+' aluno(s) na lista · '+L.filter(function(a){return !D.resp[a.cpf]}).length+' sem responsável';
  atrPessoas();atrGruposRender();atrLimpaPlano();
}
// Modo de distribuição escolhido.
function atrModo(){return document.querySelector('input[name=atrModo]:checked').value}
// Alunos que entram na distribuição (filtrados; opcionalmente só os sem responsável).
function atrAlvo(){var so=$('atrSo').checked;return filtrados().filter(function(a){return !so||!D.resp[a.cpf]})}
// Reage a mudanças nas opções.
function atrMudou(){atrGruposRender();atrLimpaPlano()}
// Nomes dos grupos (curso, turno, status).
var ATR_ROT={curso:'cursos',turno:'turnos',status:'status'};
// Lista os valores existentes (cursos, turnos ou status) entre os alunos que entram, para marcar e escolher o responsável de cada um
function atrGruposRender(){
  var box=$('atrGrupos');if(!box)return;
  if(atrModo()!=='grupo'){box.style.display='none';return}
  box.style.display='';
  var campo=$('atrGrupo').value;
  if(ATR.campo!==campo){ATR.campo=campo;ATR.grupos={}}
  var cnt={};atrAlvo().forEach(function(a){var k=String(a[campo]||'—');cnt[k]=(cnt[k]||0)+1});
  var keys=Object.keys(cnt).sort(function(x,y){return cnt[y]-cnt[x]||x.localeCompare(y,'pt')});
  ATR.gl=keys;ATR.gc=cnt;
  keys.forEach(function(k){if(!ATR.grupos[k])ATR.grupos[k]={on:true,resp:''}});
  if(!keys.length){box.innerHTML='<span class="muted">Nenhum aluno entra com os filtros atuais.</span>';return}
  var opts=function(sel){return '<option value="">Automático</option>'+D.usuarios.map(function(u){return '<option value="'+esc(u.email)+'"'+(sel===u.email?' selected':'')+'>'+esc(u.nome)+'</option>'}).join('')};
  box.innerHTML='<div class="atr-gcab"><span class="atr-lbl">Escolha os '+ATR_ROT[campo]+' <a href="#" id="atrGAll">todos</a><a href="#" id="atrGNone">nenhum</a></span>'+
    '<span class="atr-gdef">Definir o responsável dos marcados: <select id="atrGBulk">'+opts('')+'</select> <button type="button" class="btn-secondary" id="atrGSet">Definir</button></span></div>'+
    keys.map(function(k,i){var g=ATR.grupos[k];
      return '<div class="atr-grow"><label class="atr-gnome"><input type="checkbox" data-i="'+i+'"'+(g.on?' checked':'')+'> <span>'+esc(k)+'</span> <small>('+cnt[k]+' aluno(s))</small></label>'+
             '<select data-i="'+i+'">'+opts(g.resp)+'</select></div>'}).join('')+
    '<div class="muted" id="atrGRes"></div><div class="muted">“Automático”: o sistema equilibra entre as pessoas marcadas em “Quem recebe”.</div>';
  Array.prototype.forEach.call(box.querySelectorAll('input[data-i]'),function(x){x.onchange=function(){atrGMarca(+x.getAttribute('data-i'),x.checked)}});
  Array.prototype.forEach.call(box.querySelectorAll('select[data-i]'),function(x){x.onchange=function(){atrGResp(+x.getAttribute('data-i'),x.value)}});
  $('atrGAll').onclick=function(e){e.preventDefault();atrGTodos(true)};
  $('atrGNone').onclick=function(e){e.preventDefault();atrGTodos(false)};
  $('atrGSet').onclick=function(){atrGDefinir($('atrGBulk').value)};
  atrGResumo();
}
// Marca/desmarca um grupo.
function atrGMarca(i,on){var k=ATR.gl[i];if(k===undefined)return;ATR.grupos[k].on=!!on;atrGResumo();atrLimpaPlano()}
// Define o responsável de um grupo.
function atrGResp(i,email){var k=ATR.gl[i];if(k===undefined)return;ATR.grupos[k].resp=email||'';atrLimpaPlano()}
// Marca/desmarca todos os grupos.
function atrGTodos(on){ATR.gl.forEach(function(k){ATR.grupos[k].on=!!on});atrGruposRender();atrLimpaPlano()}
// Define o mesmo responsável para os grupos marcados.
function atrGDefinir(email){ATR.gl.forEach(function(k){if(ATR.grupos[k].on)ATR.grupos[k].resp=email||''});atrGruposRender();atrLimpaPlano()}
// Resumo dos grupos marcados.
function atrGResumo(){
  var el=$('atrGRes');if(!el)return;
  var m=ATR.gl.filter(function(k){return ATR.grupos[k].on}),n=m.reduce(function(s,k){return s+ATR.gc[k]},0);
  el.textContent=m.length+' de '+ATR.gl.length+' marcado(s) · '+n+' aluno(s)';
}
// Monta o plano de distribuição {passos:[{email,nome,cpfs,det,antes}], total, sobra, ignorados} ou {erro}
function atrPlano(){
  var modo=atrModo(),L=filtrados();
  if(modo==='remover'){
    var rem=L.filter(function(a){return D.resp[a.cpf]});
    if(!rem.length)return {erro:'Nenhum aluno da lista tem responsável.'};
    return {modo:modo,passos:[{email:'',nome:'(sem responsável)',cpfs:rem.map(function(a){return a.cpf}),det:'',antes:0}],total:rem.length,sobra:0,ignorados:0};
  }
  var pessoas=D.usuarios.filter(function(u){return ATR.pessoas[u.email]});
  var alvo=atrAlvo();
  if(!alvo.length)return {erro:'Nenhum aluno da lista se encaixa (confira os filtros e a opção "somente alunos sem responsável").'};
  var campo=$('atrGrupo').value,gr={},sel=[],ignorados=0;
  if(modo==='grupo'){
    alvo.forEach(function(a){var k=String(a[campo]||'—');(gr[k]=gr[k]||[]).push(a.cpf)});
    sel=Object.keys(gr).filter(function(k){var g=ATR.grupos[k];return !g||g.on!==false});
    if(!sel.length)return {erro:'Marque ao menos um grupo na lista de '+ATR_ROT[campo]+'.'};
    ignorados=alvo.length-sel.reduce(function(s,k){return s+gr[k].length},0);
    var fixo=function(k){var e=ATR.grupos[k]&&ATR.grupos[k].resp;return e&&D.usuarios.some(function(u){return u.email===e})?e:''};
    if(sel.some(function(k){return !fixo(k)})&&!pessoas.length)return {erro:'Há grupos em "Automático": marque pessoas em "Quem recebe" ou escolha o responsável de cada grupo.'};
    alvo=alvo.filter(function(a){return sel.indexOf(String(a[campo]||'—'))>=0});
  }else if(!pessoas.length)return {erro:'Marque ao menos uma pessoa em "Quem recebe".'};
  var envol=pessoas.slice();                                   // marcadas + responsáveis escolhidos nos grupos
  if(modo==='grupo')sel.forEach(function(k){var e=fixo(k);if(e&&!envol.some(function(u){return u.email===e}))envol.push(D.usuarios.filter(function(u){return u.email===e})[0])});
  var emAlvo={};alvo.forEach(function(a){emAlvo[a.cpf]=1});
  var base={},peso={},por={},det={};
  envol.forEach(function(u){base[u.email]=0;por[u.email]=[];det[u.email]={}});
  D.alunos.forEach(function(a){if(!emAlvo[a.cpf]&&base[D.resp[a.cpf]]!==undefined)base[D.resp[a.cpf]]++});   // o que a pessoa já tem e não será mexido
  envol.forEach(function(u){peso[u.email]=$('atrCarga').checked?base[u.email]:0});
  function menor(){var b=pessoas[0];pessoas.forEach(function(u){if(peso[u.email]+por[u.email].length<peso[b.email]+por[b.email].length)b=u});return b}
  var sobra=0;
  if(modo==='igual'){
    alvo.forEach(function(a){por[menor().email].push(a.cpf)});
  }else if(modo==='grupo'){
    var ord=sel.slice().sort(function(x,y){return gr[y].length-gr[x].length||x.localeCompare(y,'pt')});
    ord.filter(fixo).forEach(function(k){var e=fixo(k);Array.prototype.push.apply(por[e],gr[k]);det[e][k]=gr[k].length});          // escolhidos à mão primeiro
    ord.filter(function(k){return !fixo(k)}).forEach(function(k){var u=menor();Array.prototype.push.apply(por[u.email],gr[k]);det[u.email][k]=gr[k].length});   // o resto, equilibrado
  }else{        // qtd
    var n=Math.max(1,parseInt($('atrQtd').value,10)||0),i=0;
    pessoas.forEach(function(u){por[u.email]=alvo.slice(i,i+n).map(function(a){return a.cpf});i+=n});
    sobra=Math.max(0,alvo.length-i);
  }
  var passos=envol.filter(function(u){return por[u.email].length}).map(function(u){
    return {email:u.email,nome:u.nome,cpfs:por[u.email],antes:base[u.email],det:Object.keys(det[u.email]).map(function(k){return k+' ('+det[u.email][k]+')'}).join(', ')};
  });
  return {modo:modo,passos:passos,total:passos.reduce(function(s,p){return s+p.cpfs.length},0),sobra:sobra,ignorados:ignorados};
}
// Mostra a prévia do que será atribuído.
function atrPrevia(){
  var p=atrPlano();atrLimpaPlano();
  if(p.erro){$('atrPrevia').innerHTML='<div class="atr-aviso">'+esc(p.erro)+'</div>';return}
  ATR.plano=p;
  var rem=p.modo==='remover';
  $('atrPrevia').innerHTML='<table class="atr-tab"><thead><tr><th>'+(rem?'Ação':'Responsável')+'</th><th>Alunos</th>'+(rem?'':'<th>Ficará com</th>')+'<th>Detalhe</th></tr></thead><tbody>'+
    p.passos.map(function(s){return '<tr><td>'+esc(s.nome)+'</td><td><b>'+s.cpfs.length+'</b></td>'+(rem?'':'<td>'+(s.antes+s.cpfs.length)+' no total</td>')+'<td class="muted">'+esc(rem?'o responsável será retirado':s.det)+'</td></tr>'}).join('')+'</tbody></table>'+
    (p.ignorados?'<div class="atr-info">'+p.ignorados+' aluno(s) de grupos desmarcados não serão alterados.</div>':'')+
    (p.sobra?'<div class="atr-aviso">'+p.sobra+' aluno(s) da lista ficam sem atribuição (aumente a quantidade por pessoa ou marque mais gente).</div>':'');
  $('atrApl').disabled=false;
  $('atrSt').textContent=p.total+' aluno(s) · '+(rem?'remoção':p.passos.length+' pessoa(s)');
}
// Envia a atribuição ao servidor (setRespLote).
function atrAplicar(){
  var p=ATR.plano;if(!p||!p.passos.length)return;
  var rem=p.modo==='remover';
  if(!confirm(rem?'Remover o responsável de '+p.total+' aluno(s)?':'Atribuir '+p.total+' aluno(s) a '+p.passos.length+' pessoa(s)?'))return;
  $('atrApl').disabled=true;$('atrPrev').disabled=true;SYNC.pend++;
  var feitos=0;
  function fim(ok,msg){SYNC.pend=Math.max(0,SYNC.pend-1);selaSync();$('atrPrev').disabled=false;if(ok){linhas();$('atrSt').textContent='✔ '+feitos+' aluno(s) '+(rem?'sem responsável':'atribuído(s)')+'.';toast(rem?'Responsáveis removidos.':'Responsáveis atribuídos.')}else{$('atrApl').disabled=false;$('atrSt').textContent='';toast(msg||'Falha ao atribuir.','err')}}
  (function passo(i){
    if(i>=p.passos.length){fim(true);return}
    var s=p.passos[i],partes=[];
    for(var k=0;k<s.cpfs.length;k+=2000)partes.push(s.cpfs.slice(k,k+2000));
    $('atrSt').textContent='Aplicando '+(i+1)+' de '+p.passos.length+'…';
    (function parte(j){
      if(j>=partes.length){passo(i+1);return}
      call('setRespLote',{sem:ME.semestre,cpfs:partes[j],email:s.email}).then(function(){
        partes[j].forEach(function(c){if(s.email)D.resp[c]=s.email;else delete D.resp[c]});feitos+=partes[j].length;parte(j+1);
      }).catch(function(e){fim(false,(e&&e.message)||String(e))});
    })(0);
  })(0);
}

// Cria uma janela sobreposta (popup) com o HTML informado.
function ov(html,cls,wrap){var o=document.createElement('div');o.className='ov'+(wrap?' '+wrap:'');o.innerHTML='<div class="'+(cls||'popup')+'">'+html+'</div>';o.onclick=function(e){if(e.target===o)o.remove()};$('mroot').appendChild(o);
  Array.prototype.forEach.call(o.querySelectorAll('.popup-close'),function(x){x.onclick=function(){o.remove()}});return o}

  '<div class="popup-section"><div class="section-title">📝 Registro de Contato</div><div class="reg-grid"><div class="reg-field"><label>Objetivo do contato</label><select id="rO"></select></div><div class="reg-field"><label>Meio de comunicação</label><select id="rM"></select></div><div class="reg-field"><label>Resultado do contato</label><select id="rR"></select></div><div class="reg-field full"><label>Observação</label><textarea id="rB" rows="3" placeholder="Descreva o contato realizado..."></textarea></div></div><div style="display:flex;gap:8px"><button class="btn-save" id="rS">✅ Salvar Registro</button><button class="btn-secondary" id="rC" style="display:none">Cancelar edição</button></div></div>'+

    function por(id){return L.filter(function(r){return r.id===id})[0]}
    Array.prototype.forEach.call(q('rL').querySelectorAll('.history-item'),function(el){el.onclick=function(){obs(por(el.dataset.i))}});

/* ---------- gráficos ---------- */
// Cria um gráfico Chart.js, aguardando a biblioteca carregar (até ~20 s).
function chart(id,type,labels,sets,stack){if(typeof Chart==='undefined'){if((chart._n=(chart._n||0)+1)<80)setTimeout(function(){chart(id,type,labels,sets,stack)},250);return}chart._n=0;if(CH[id])CH[id].destroy();var el=$(id);if(!el)return;
  var pie=type==='pie',one=sets.length===1;
  var ds=sets.map(function(s,i){var col=(pie||(one&&type==='bar'&&labels.length<=12))?labels.map(function(_,k){return PAL[k%PAL.length]}):PAL[i%PAL.length];return {label:s.l,data:s.d,backgroundColor:col,borderColor:pie?'transparent':PAL[i%PAL.length],borderRadius:pie?0:4}});
  var txt=getComputedStyle(document.body).color,grid='rgba(128,138,160,.2)';
  CH[id]=new Chart(el,{type:pie?'doughnut':type,data:{labels:labels,datasets:ds},options:{maintainAspectRatio:false,cutout:pie?'55%':undefined,plugins:{legend:{display:pie||sets.length>1,position:pie?'right':'top',labels:{color:txt,boxWidth:12}}},scales:pie?{}:{x:{stacked:!!stack,ticks:{color:txt},grid:{display:false}},y:{stacked:!!stack,beginAtZero:true,ticks:{color:txt,precision:0},grid:{color:grid}}}}})}
// HTML de um bloco com título, subtítulo e botão de download.
function box(id,t,sub,f){return '<div class="section-box" id="bx_'+id+'"><div class="dl-head"><div><h3>'+t+'</h3>'+(sub?'<p class="sh">'+sub+'</p>':'')+'</div>'+dlBtn('bx_'+id,t.replace(/^\S+\s/,''),f)+'</div><div class="ch"><canvas id="'+id+'"></canvas></div></div>'}
// Filtra registros por mês, intervalo e data exata.
function filtroData(R,m,i,f,e){return R.filter(function(r){var d=r.data.slice(0,10);return(!m.length||m.indexOf(d.slice(0,7))>=0)&&(!i||d>=i)&&(!f||d<=f)&&(!e||d===e)})}
// Monta tabela dinâmica HTML com totais.
function pivot(rows,data,cols,first){if(!rows.length)return '<p class="muted" style="padding:12px">Sem dados.</p>';var tot={};
  var h='<table class="dyn-table"><thead><tr><th>'+first+'</th>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'<th>Total</th></tr></thead><tbody>';
  rows.forEach(function(r,i){var s=0;h+='<tr><td>'+esc(r)+'</td>'+cols.map(function(c){var v=data[i][c]||0;s+=v;tot[c]=(tot[c]||0)+v;return '<td class="num">'+(v||'')+'</td>'}).join('')+'<td class="num">'+s+'</td></tr>'});
  var g=0;h+='<tr><td><b>Total</b></td>'+cols.map(function(c){g+=tot[c]||0;return '<td class="num">'+(tot[c]||0)+'</td>'}).join('')+'<td class="num">'+g+'</td></tr></tbody></table>';return '<div class="dyn-wrap">'+h+'</div>'}
// HTML de um filtro de data.
function fdate(id,l){return '<div class="filter-group"><label>'+l+'</label><input type="date" id="'+id+'"></div>'}
// HTML de um filtro de seleção múltipla.
function fms(id,l){return '<div class="filter-group"><label>'+l+'</label><div id="'+id+'"></div></div>'}

// Estado do botão Semestre de cada tabela da aba Colaborador (t = Tabela Detalhada, p = Registros por colaborador e dia).
var TS={t:false,p:false};   // botão "Semestre" das tabelas: ignora os filtros de data da aba e usa o semestre inteiro
// Quando o filtro próprio de uma tabela muda: desliga o Semestre dela e recalcula.
function tfMud(p){TS[p]=false;cAtu()}
// Botão Semestre de uma tabela: liga/desliga; ao ligar, limpa data e mês da tabela e passa a usar o semestre inteiro.
function tfSem(p){TS[p]=!TS[p];if(TS[p]){$(p+'D').value='';var m=MS[p+'M'];m.sel=[];msMake(p+'M',m.opts,m.cb)}cAtu()}
// Atualiza a aba Colaborador conforme os filtros da aba (colaborador, resultado, datas do banco).
// As tabelas com filtro próprio (mês, data única ou Semestre) usam esse filtro no lugar dos filtros de data da aba; sem filtro próprio, acompanham a aba.
// A Tabela Detalhada mostra só colunas e colaboradores com algum valor (e o filtro "Mostrar" escolhe as colunas); o download passa a listar os filtros usados (dfJ).
function cAtu(){var cb=msv('cB'),crs=msv('cRs'),nm=function(e){return D.umap[e]||e},bs=bancoSet(msv('cBI'),msv('cBF'));
  var okR=function(r){return(!cb.length||cb.indexOf(r.colab)>=0)&&(!crs.length||crs.indexOf(r.resultado)>=0)&&(!bs||bs[r.cpf])};
  var R=filtroData(D.regs,msv('cM'),$('cI').value,$('cF').value).filter(okR);
  // Tabelas com filtro próprio (mês, data única ou semestre): sem filtro próprio, acompanham os filtros da aba
  var proprio=function(p){return TS[p]||msv(p+'M').length>0||!!$(p+'D').value};
  var RJ=function(p){return proprio(p)?filtroData(D.regs,TS[p]?[]:msv(p+'M'),'','',TS[p]?'':$(p+'D').value).filter(okR):R};
  var dfJ=function(p,extra){var g=proprio(p)?FCOL.split(',').filter(function(i){return ['cM','cI','cF'].indexOf(i)<0}):FCOL.split(',');var b=$('bx_c'+(p==='t'?'T':'P')).querySelector('.dl-btn');if(b)b.dataset.df=g.concat(extra).join(',')};
  var respN=cnt(Object.keys(D.resp).filter(function(c){return D.resp[c]&&(!bs||bs[c])}),function(c){return D.resp[c]});
  var ativos={};Object.keys(D.resp).forEach(function(c){if(D.resp[c])ativos[D.resp[c]]=1});D.regs.forEach(function(r){ativos[r.colab]=1});
  var us=D.usuarios.filter(function(u){return ativos[u.email]&&(!cb.length||cb.indexOf(u.email)>=0)});
  var res=OPC.Resultado;
  var aset={};D.alunos.forEach(function(a){aset[a.cpf]=1});
  var naoN={};Object.keys(D.resp).forEach(function(c){var e=D.resp[c];            // responsável definido e nenhum contato registrado ainda
    if(!e||(bs&&!bs[c])||!aset[c]||(D.rmap[c]||[]).length)return;naoN[e]=(naoN[e]||0)+1});
  $('cK').innerHTML=us.map(function(u,i){var mine=R.filter(function(r){return r.colab===u.email}),rc=cnt(mine,function(r){return r.resultado});
    return '<div class="colab-card" id="cd_'+i+'">'+dlBtn('cd_'+i,'Cartão '+u.nome,FCOL)+'<div class="cc-name"><span class="cc-avatar">'+avatar(u.foto,u.nome)+'</span>'+esc(u.nome)+'</div><div class="colab-stat"><span class="cs-lbl">Responsável por</span><span class="cs-val">'+(respN[u.email]||0)+' aluno(s)</span></div><div class="colab-stat"><span class="cs-lbl">Contatos realizados</span><span class="cs-val">'+mine.length+'</span></div><div class="colab-stat"><span class="cs-lbl">Contatos não realizados</span><span class="cs-val">'+(naoN[u.email]||0)+'</span></div>'+
    res.filter(function(x){return rc[x]>0}).map(function(x){return '<div class="colab-stat"><span class="cs-lbl">'+esc(x)+'</span><span class="cs-val">'+(rc[x]||0)+'</span></div>'}).join('')+'</div>'}).join('')||'<p class="muted">Sem usuários na seleção.</p>';
  var ks=us.map(function(u){return u.nome});
  chart('cc1','bar',ks,[{l:'Contatos',d:us.map(function(u){return R.filter(function(r){return r.colab===u.email}).length})}]);
  chart('cc2','bar',ks,res.map(function(rs){return {l:rs,d:us.map(function(u){return R.filter(function(r){return r.colab===u.email&&r.resultado===rs}).length})}}),true);
  var ru=us.filter(function(u){return respN[u.email]});chart('cc3','pie',ru.map(function(u){return u.nome}),[{l:'Alunos',d:ru.map(function(u){return respN[u.email]})}]);
  var dias=Object.keys(cnt(R,function(r){return r.data.slice(0,10)})).sort(),m={};R.forEach(function(r){var d=r.data.slice(0,10);m[d]=m[d]||{};m[d][nm(r.colab)]=(m[d][nm(r.colab)]||0)+1});
  chart('cc4','bar',dias.map(ddmm),[{l:'Registros',d:dias.map(function(d){return Object.keys(m[d]).reduce(function(s,k){return s+m[d][k]},0)})}]);
  var RT=RJ('t'),opT=msv('tO');dfJ('t',['tM','tD','tO']);
  var rowsT=us.map(function(u){var mine=RT.filter(function(r){return r.colab===u.email});var o={'Responsável por':respN[u.email]||0,'Contatos':mine.length,'Contatos não realizados':naoN[u.email]||0};res.forEach(function(rs){o[rs]=mine.filter(function(r){return r.resultado===rs}).length});return o});
  var cols=['Responsável por','Contatos','Contatos não realizados'].concat(res).filter(function(c){return(!opT.length||opT.indexOf(c)>=0)&&rowsT.some(function(o){return o[c]>0})});   // só colunas com algum valor
  var linT=us.map(function(u,i){return {u:u,o:rowsT[i]}}).filter(function(x){return cols.some(function(c){return x.o[c]>0})});            // só colaboradores com algum valor
  $('cT').innerHTML=linT.length?'<div class="dyn-wrap"><table class="dyn-table"><thead><tr><th>Colaborador</th>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+linT.map(function(x){return '<tr><td>'+esc(x.u.nome)+'</td>'+cols.map(function(c){return '<td class="num">'+(x.o[c]>0?x.o[c]:'')+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>':'<p class="muted" style="padding:12px">Sem dados para os filtros selecionados.</p>';
  var pb=msv('pB'),RP=RJ('p').filter(function(r){return!pb.length||pb.indexOf(r.colab)>=0});dfJ('p',['pM','pD','pB']);
  var diasP=Object.keys(cnt(RP,function(r){return r.data.slice(0,10)})).sort().reverse(),mP={};   // dia mais recente em cima
  RP.forEach(function(r){var d=r.data.slice(0,10);mP[d]=mP[d]||{};mP[d][nm(r.colab)]=(mP[d][nm(r.colab)]||0)+1});
  $('cP').innerHTML=pivot(diasP.map(ddmm),diasP.map(function(d){return mP[d]}),Object.keys(cnt(RP,function(r){return nm(r.colab)})),'Data')}


/* ---------- Indicador - Atendimentos e Alunos contatados ---------- */
// Estado do indicador Atendimentos e Alunos contatados.
var IA_SEM=false,IA_ULT=null;
// Botão Filtrar.
function iaFiltrar(){IA_SEM=false;iaRender()}
// Botão Semestre.
function iaSem(){IA_SEM=!IA_SEM;if(IA_SEM){$('iaI').value='';$('iaF').value='';var m=MS.iaM;m.sel=[];msMake('iaM',m.opts,m.cb)}iaRender()}
// Botão Limpar.
function iaLimpar(){IA_SEM=false;limpar(['iaM'],['iaI','iaF'],iaRender)}
// Calcula os números (usado na tela, no Excel e na imagem)
function iaModelo(){
  var nm=function(r){return D.umap[r.colab]||r.colabNome||r.colab};
  var cols=[];D.regs.forEach(function(r){var n=nm(r);if(cols.indexOf(n)<0)cols.push(n)});
  cols.sort(function(a,b){return a.localeCompare(b,'pt',{sensitivity:'base'})});
  var meses=IA_SEM?[]:msv('iaM'),modo=IA_SEM?'semestre':(meses.length?'mes':'dia');
  var R=filtroData(D.regs,meses,IA_SEM?'':$('iaI').value,IA_SEM?'':$('iaF').value,'');
  if(!R.length||!cols.length)return {vazio:true,modo:modo};
  var G={},ordem=[],vistos={};
  R.forEach(function(r){
    var dia=r.data.slice(0,10),k=modo==='dia'?dia:modo==='mes'?dia.slice(0,7):'sem',c=nm(r);
    if(!G[k]){G[k]={at:{},al:{}};ordem.push(k)}
    G[k].at[c]=(G[k].at[c]||0)+1;
    var u=c+'|'+dia+'|'+r.cpf;                                   // CPF repetido no mesmo dia, pelo mesmo colaborador: conta uma vez
    if(r.cpf&&!vistos[u]){vistos[u]=1;G[k].al[c]=(G[k].al[c]||0)+1}
  });
  ordem.sort().reverse();
  var soma=function(o){return cols.reduce(function(s,c){return s+(o[c]||0)},0)};
  var grupos=ordem.map(function(k){var g=G[k];return {
    k:k,rot:modo==='dia'?ddmm(k):modo==='mes'?MESES[+k.slice(5,7)-1]+'/'+k.slice(0,4):String(D.sem),at:g.at,al:g.al,tAt:soma(g.at),tAl:soma(g.al)}});
  var ga={},gl={};grupos.forEach(function(g){cols.forEach(function(c){ga[c]=(ga[c]||0)+(g.at[c]||0);gl[c]=(gl[c]||0)+(g.al[c]||0)})});
  return {cols:cols,grupos:grupos,modo:modo,rotCol:modo==='dia'?'Data':modo==='mes'?'Mês':'Semestre',
          geral:{at:ga,al:gl,tAt:soma(ga),tAl:soma(gl)},ocultarGeral:(modo!=='dia'&&grupos.length===1)}}
// Desenha a tabela por data, atividade e colaborador e, quando há várias datas, a janela de total do período (iaPeriodo).
function iaRender(){
  var cont=$('iaT');if(!cont)return;
  var b=$('iaS');if(b)b.classList.toggle('on',IA_SEM);
  var m=iaModelo(),info=$('iaInfo');IA_ULT=m;
  var tx=m.modo==='mes'?'📅 Mostrando o total de cada mês selecionado, sem separar por data.':m.modo==='semestre'?'📅 Semestre '+D.sem+' em um único total.':'';
  info.textContent=tx;info.style.display=tx?'block':'none';
  var wb=$('iaWBox');if(wb)wb.innerHTML='';
  if(m.vazio){cont.innerHTML='<p class="muted" style="padding:12px">Nenhum registro encontrado para os filtros selecionados.</p>';return}
  var C=m.cols,v=function(o,c){return '<td class="num">'+(o[c]||0)+'</td>'};
  function lin(rot,rotulo,o,t,cls){return '<tr'+(cls?' class="'+cls+'"':'')+(rot?'':'')+'>'+(rot||'')+'<td class="ia-ativ">'+rotulo+'</td>'+C.map(function(c){return v(o,c)}).join('')+'<td class="num">'+(t||0)+'</td></tr>'}
  var h='<div class="dyn-wrap ia-wrap"><table class="dyn-table ia-table"><thead><tr><th>'+m.rotCol+'</th><th>Atividade</th>'+C.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'<th>Total</th></tr></thead><tbody>';
  m.grupos.forEach(function(g){
    h+=lin('<td class="ia-data" rowspan="4"><b>'+esc(g.rot)+'</b></td>','Atendimentos realizados',g.at,g.tAt)+
       lin('','Alunos contatados',g.al,g.tAl)+
       lin('','Total de Atendimentos Realizados',g.at,g.tAt,'ia-tot')+
       lin('','Total de Alunos Contatados',g.al,g.tAl,'ia-tot')});
  if(!m.ocultarGeral){
    var G=m.geral;
    h+='<tr class="ia-geral"><td colspan="2">Total Geral de Atendimentos Realizados</td>'+C.map(function(c){return v(G.at,c)}).join('')+'<td class="num">'+G.tAt+'</td></tr>'+
       '<tr class="ia-geral"><td colspan="2">Total Geral de Alunos Contatados</td>'+C.map(function(c){return v(G.al,c)}).join('')+'<td class="num">'+G.tAl+'</td></tr>'}
  cont.innerHTML=h+'</tbody></table></div>';
  iaPeriodo(m)}
// Mais de uma data selecionada (ex.: uma semana): janela extra com a SOMA do período, sem separar por data
// Quando há mais de uma data no filtro (ex.: uma semana), mostra a janela extra "Total do período" com a soma de atendimentos e alunos contatados, sem separar por data.
function iaPeriodo(m){
  var wb=$('iaWBox');if(!wb)return;
  var temFaixa=!!($('iaI').value||$('iaF').value);
  if(m.modo!=='dia'||!temFaixa||m.grupos.length<2)return;
  var ini=$('iaI').value||m.grupos[m.grupos.length-1].k,fim=$('iaF').value||m.grupos[0].k,C=m.cols,G=m.geral;
  var td=function(o,c){return '<td class="num">'+(o[c]||0)+'</td>'};
  wb.innerHTML='<div class="section-box" id="bx_iaW"><div class="dl-head"><div><h3>📆 Total do período: '+ddmm(ini)+' até '+ddmm(fim)+'</h3><p class="sh">Soma dos '+m.grupos.length+' dias com registro, sem separar por data</p></div>'+dlBtn('bx_iaW','Atendimentos e Alunos contatados - total do periodo','iaM,iaI,iaF','iaW')+'</div>'+
    '<div id="iaW"><div class="dyn-wrap ia-wrap" style="max-height:none"><table class="dyn-table ia-table"><thead><tr><th>Período</th><th>Atividade</th>'+C.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'<th>Total</th></tr></thead><tbody>'+
    '<tr><td class="ia-data"><b>'+ddmm(ini)+' até '+ddmm(fim)+'</b></td><td class="ia-ativ">Atendimentos realizados</td>'+C.map(function(c){return td(G.at,c)}).join('')+'<td class="num">'+G.tAt+'</td></tr>'+
    '<tr><td class="ia-data"><b>'+ddmm(ini)+' até '+ddmm(fim)+'</b></td><td class="ia-ativ">Alunos contatados</td>'+C.map(function(c){return td(G.al,c)}).join('')+'<td class="num">'+G.tAl+'</td></tr></tbody></table></div></div></div>'}
// Planilha do Excel (uma linha por data/atividade, com a data repetida para facilitar filtros)
function iaAbaExcel(){
  var m=IA_ULT;if(!m||m.vazio)return null;
  var cab=[m.rotCol,'Atividade'].concat(m.cols).concat(['Total']),linhas=[],tot=[];
  function add(rot,nome,o,t,destaque){if(destaque)tot.push(linhas.length);linhas.push([rot,nome].concat(m.cols.map(function(c){return o[c]||0})).concat([t]))}
  m.grupos.forEach(function(g){
    add(g.rot,'Atendimentos realizados',g.at,g.tAt);add(g.rot,'Alunos contatados',g.al,g.tAl);
    add(g.rot,'Total de Atendimentos Realizados',g.at,g.tAt,1);add(g.rot,'Total de Alunos Contatados',g.al,g.tAl,1)});
  if(!m.ocultarGeral){add('Total Geral','Total Geral de Atendimentos Realizados',m.geral.at,m.geral.tAt,1);add('Total Geral','Total Geral de Alunos Contatados',m.geral.al,m.geral.tAl,1)}
  return {nome:'Atendimentos e Alunos',cab:cab,linhas:linhas,totalLinhas:tot,larg:cab.map(function(c,i){return i===0?16:i===1?36:Math.max(14,c.length+4)})}}

/* Arraste pelo símbolo de pontos (⋮⋮) para mover a opção dentro do próprio grupo. A opção só troca de lugar quando o ponteiro
   passa exatamente por cima de outra opção. Ao soltar, a ordem é salva para todos. */
function opcArrastar(bd,refazer){
  if(!document.getElementById('opcDragCss')){var st=document.createElement('style');st.id='opcDragCss';
    st.textContent='.opts-list .opt-item{justify-content:flex-start;gap:10px}.opt-txt{flex:1;min-width:0;overflow-wrap:anywhere}'
    +'.opt-grip{display:grid;grid-template-columns:repeat(2,3px);grid-auto-rows:3px;gap:2px;padding:6px 5px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none;border-radius:4px}'
    +'.opt-grip i{width:3px;height:3px;border-radius:50%;background:var(--text-muted,#94a3b8)}.opt-grip:hover i{background:var(--info,#2563eb)}'
    +'.opts-list .opt-item.arr{opacity:.6;border-style:dashed;box-shadow:0 4px 14px rgba(0,0,0,.2)}.opts-list.arrastando,.opts-list.arrastando .opt-grip{cursor:grabbing}';
    document.head.appendChild(st)}
  Array.prototype.forEach.call(bd.querySelectorAll('.opts-list'),function(lista){
    var add=lista.nextSibling&&lista.nextSibling.querySelector?lista.nextSibling.querySelector('button[data-a]'):null,tipo=add?add.dataset.a:'';
    function itens(){return Array.prototype.slice.call(lista.querySelectorAll('.opt-item'))}
    Array.prototype.forEach.call(lista.querySelectorAll('.opt-grip'),function(g){
      var it=g.parentNode;
      g.addEventListener('pointerdown',function(e){
        if(e.pointerType==='mouse'&&e.button!==0)return;
        e.preventDefault();it.classList.add('arr');lista.classList.add('arrastando');
        document.addEventListener('pointermove',mov);document.addEventListener('pointerup',soltou);document.addEventListener('pointercancel',cancelou)});

    var g=el.closest('.filter-group'),lb=g&&g.querySelector('label')?g.querySelector('label').textContent:id;
    if(MS[id]){var s=MS[id].sel;if(!s.length)return;
      out.push([lb,MS[id].opts.filter(function(o){return s.indexOf(o.v)>=0}).map(function(o){return o.t}).join(', ')])}
    else if(el.value)out.push([lb,/^\d{4}-\d{2}-\d{2}$/.test(el.value)?ddmm(el.value):el.value])});
  return out}
// Subtítulo das imagens exportadas.
function dlSub(f){
  var t='Semestre '+(ME&&ME.semestre||''),l=listFiltros(f);
  if(l.length)t+=' · '+l.map(function(x){return x[0]+': '+x[1]}).join(' · ');
  return t.length>150?t.slice(0,147)+'…':t}
// Nome do arquivo: CallCenter_semestre_nome.
function dlArq(n,ext){return 'CallCenter_'+nomeArq(ME.semestre)+'_'+nomeArq(n)+'.'+ext}
// Indicador - Atendimentos e Alunos contatados: uma imagem para cada data (mês/semestre, conforme o filtro); várias vão num .zip
// HTML da tabela do indicador de atendimentos para exportação.
function iaTabelaHtml(m,g,geral){
  var C=m.cols,v=function(o,c){return '<td class="num">'+(o[c]||0)+'</td>'};
  function lin(rot,rotulo,o,t,cls){return '<tr'+(cls?' class="'+cls+'"':'')+'>'+(rot||'')+'<td class="ia-ativ">'+rotulo+'</td>'+C.map(function(c){return v(o,c)}).join('')+'<td class="num">'+(t||0)+'</td></tr>'}
  var h='<div class="dyn-wrap ia-wrap" style="max-height:none;overflow:visible"><table class="dyn-table ia-table"><thead><tr><th>'+(geral?'':m.rotCol)+'</th><th>Atividade</th>'+C.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'<th>Total</th></tr></thead><tbody>';
  if(geral){
    h+='<tr class="ia-geral"><td colspan="2">Total Geral de Atendimentos Realizados</td>'+C.map(function(c){return v(m.geral.at,c)}).join('')+'<td class="num">'+m.geral.tAt+'</td></tr>'+
       '<tr class="ia-geral"><td colspan="2">Total Geral de Alunos Contatados</td>'+C.map(function(c){return v(m.geral.al,c)}).join('')+'<td class="num">'+m.geral.tAl+'</td></tr>'}
  else h+=lin('<td class="ia-data" rowspan="4"><b>'+esc(g.rot)+'</b></td>','Atendimentos realizados',g.at,g.tAt)+lin('','Alunos contatados',g.al,g.tAl)+
    lin('','Total de Atendimentos Realizados',g.at,g.tAt,'ia-tot')+lin('','Total de Alunos Contatados',g.al,g.tAl,'ia-tot');
  return h+'</tbody></table></div>'}
// Uma imagem por data (mês/semestre, conforme o filtro); várias vão num .zip.
function iaImagens(b){
  var m=IA_ULT;if(!m||m.vazio){toast('Não há dados no indicador para baixar.','err');return}
  b.classList.add('busy');toast('Gerando imagens...');
  var itens=m.grupos.map(function(g){return {k:g.k,rot:g.rot,html:iaTabelaHtml(m,g,false)}});
  if(itens.length>1&&!m.ocultarGeral)itens.push({k:'Total_geral',rot:'Total geral',html:iaTabelaHtml(m,null,true)});
  var host=document.createElement('div');host.style.cssText='position:fixed;left:-100000px;top:0;width:max-content;max-width:none;';document.body.appendChild(host);
  var arquivos=[],p=Promise.resolve(),sub=dlSub(b.dataset.df);
  itens.forEach(function(it){
    p=p.then(function(){host.innerHTML='<div id="iaTmp" class="section-box">'+it.html+'</div>';
      return blocoParaJpg($('iaTmp'),'Indicador - Atendimentos e Alunos contatados',sub+' · '+(it.k==='Total_geral'?'Total geral':m.rotCol+': '+it.rot))})
     .then(function(bytes){arquivos.push({nome:dlArq('Indicador - Atendimentos e Alunos contatados '+(m.modo==='semestre'?'':it.k),'jpg'),dados:bytes})})});
  p.then(function(){
    if(arquivos.length===1){baixarBytes(arquivos[0].nome,arquivos[0].dados,'image/jpeg');toast('Imagem baixada: '+arquivos[0].nome)}
    else{var z=dlArq('Indicador - Atendimentos e Alunos contatados imagens','zip');baixarBytes(z,zipStore(arquivos),'application/zip');toast(arquivos.length+' imagens baixadas em '+z)}
  }).catch(function(e){toast('Erro ao gerar as imagens: '+((e&&e.message)||e),'err')})
  .then(function(){document.body.removeChild(host);b.classList.remove('busy')})}
// Baixa um bloco em JPG.
function dlImagem(b){
  if(b.dataset.dt==='bx_ia'){iaImagens(b);return}
  var el=$(b.dataset.dt);if(!el){toast('Nada para baixar.','err');return}

  b.classList.add('busy');toast('Gerando imagem...');
  blocoParaJpg(el,CFG.nomeSistema||'Call Center FIES',dlSub(b.dataset.df)).then(function(bytes){
    var nome=dlArq(b.dataset.dn,'jpg');baixarBytes(nome,bytes,'image/jpeg');toast('Imagem baixada: '+nome);
  }).catch(function(e){toast('Erro ao gerar a imagem: '+((e&&e.message)||e),'err')})
  .then(function(){b.classList.remove('busy')})}
// Converte uma tabela HTML em aba do Excel.
function tabelaParaAba(t,nome){
  var cab=[].map.call(t.querySelectorAll('thead th'),function(th){return th.textContent.trim()});
  var linhas=[].map.call(t.querySelectorAll('tbody tr'),function(tr){
    return [].map.call(tr.children,function(td,i){var s=td.textContent.trim();return(i>0&&/^-?\d+$/.test(s))?Number(s):s})});
  if(!cab.length||!linhas.length)return null;
  return {nome:nome,cab:cab,linhas:linhas,larg:cab.map(function(c,i){return i===0?30:Math.max(14,c.length+4)}),
          totalUltima:String(linhas[linhas.length-1][0]).toLowerCase()==='total'}}
// Baixa as tabelas do bloco em Excel.
function dlExcel(b){
  var abas=[];
  (b.dataset.dx||'').split(',').forEach(function(id){if(id==='iaT'){var ai=iaAbaExcel();if(ai)abas.push(ai);return}var t=document.querySelector('#'+id+' table');if(t){var a=tabelaParaAba(t,b.dataset.dn);if(a)abas.push(a)}});
  if(!abas.length){toast('Não há dados na tabela para baixar.','err');return}
  abas.push({nome:'Filtros',cab:['Item','Valor'],larg:[26,70],linhas:[['Semestre',ME.semestre]].concat(listFiltros(b.dataset.df))});
  try{var nome=dlArq(b.dataset.dn,'xlsx');
    baixarBytes(nome,xlsxTabelas(abas),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');toast('Planilha baixada: '+nome)}
  catch(e){toast('Erro ao gerar a planilha: '+e.message,'err')}}
// Fecha o menu de download.
function fecharDlMenu(){var m=$('dlMenu');if(m)m.remove()}
// Abre a escolha Imagem ou Excel quando há tabela no bloco.
function abrirDlMenu(b){
  fecharDlMenu();var m=document.createElement('div');m.id='dlMenu';m.className='dl-menu';
  m.innerHTML='<button type="button" data-k="img">🖼️ Imagem (.jpg)</button><button type="button" data-k="xls">📊 Excel (.xlsx)</button>';
  document.body.appendChild(m);var r=b.getBoundingClientRect();
  m.style.top=(r.bottom+4)+'px';m.style.left=Math.max(8,r.right-m.offsetWidth)+'px';
  m.onclick=function(e){e.stopPropagation();var k=e.target.getAttribute('data-k');if(!k)return;fecharDlMenu();if(k==='img')dlImagem(b);else dlExcel(b)}}
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('.dl-btn'):null;
  if(!b){fecharDlMenu();return}
  if(b.dataset.dx){var aberto=$('dlMenu');fecharDlMenu();if(!aberto)abrirDlMenu(b)}else dlImagem(b)});
window.addEventListener('scroll',fecharDlMenu,true);

parent.postMessage({ccb:1,t:'pronto'},'*');
</script>
