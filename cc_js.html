<script>
  
var T=null,ME=null,CFG={},SEMS=[],OPC={},D=null,ADMIN=false,CH={},TAB='cc';
var CC=['SOLICITADO / NÃO ADITOU','SOLICITADO / ENVIADO AO BANCO'],CC0=CC[0];
var STATUS7=['ADITOU','NÃO SOLICITADO','REJEITADO','SOLICITADO / CANCELADO','SOLICITADO / EM PROCESSAMENTO','SOLICITADO / ENVIADO AO BANCO','SOLICITADO / NÃO ADITOU'];
var PAL=['#8b1e2d','#1456a0','#1e8a4c','#b86e00','#7a3fa0','#0e8a8a','#c04b5f','#5a6480','#3a7bd5','#c0392b'];
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m,tp){var t=$('toast');t.className='toast'+(tp==='err'?' err':'');t.textContent=(tp==='err'?'⚠️ ':'✅ ')+m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},tp==='err'?5000:4000)}
function call(fn,a){return new Promise(function(res,rej){google.script.run.withSuccessHandler(function(r){
  if(r.err==='SESSAO'){sair(true);return rej('sessao')}if(r.err){toast(r.err,'err');return rej(r.err)}res(r.ok)})
  .withFailureHandler(function(e){toast(e.message,'err');rej(e)}).api(T,fn,a||{})})}
function avatar(f,n){f=f||'';if(f.indexOf('emoji:')===0)return esc(f.slice(6));if(f)return '<img src="'+esc(f)+'">';return esc((n||'?').charAt(0).toUpperCase())}
function tema(t){if(t==='Tema Escuro')document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme')}
function cnt(a,f){var o={};a.forEach(function(x){var k=f(x);o[k]=(o[k]||0)+1});return o}
function ddmm(s){return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4)}
function vt(x){return {v:x,t:x}}
function kpi(cls,ic,id,l){return '<div class="kpi-card"><div class="kpi-icon '+cls+'">'+ic+'</div><div><div class="kpi-val" id="'+id+'">—</div><div class="kpi-lbl">'+l+'</div></div></div>'}

/* ---------- multi seleção ---------- */
var MS={};
function mesOpts(ms){var anos={};ms.forEach(function(m){anos[m.slice(0,4)]=1});var multi=Object.keys(anos).length>1;return ms.map(function(m){return {v:m,t:MESES[+m.slice(5,7)-1]+(multi?'/'+m.slice(0,4):'')}})}
function msv(id){return MS[id]?MS[id].sel:[]}
function closeMs(ex){Array.prototype.forEach.call(document.querySelectorAll('.msp.on'),function(p){if(!ex||p.parentNode.id!==ex)p.classList.remove('on')})}
document.addEventListener('click',function(){closeMs()});
function msMake(id,opts,cb){
  var el=$(id),prev=MS[id]?MS[id].sel:[],vals=opts.map(function(o){return o.v});
  var sel=prev.filter(function(v){return vals.indexOf(v)>=0});MS[id]={sel:sel,opts:opts,cb:cb};
  el.className='ms';el.innerHTML='<button type="button" class="msb"></button><div class="msp"></div>';
  var b=el.firstChild,p=el.lastChild;
  p.innerHTML='<label class="mi"><input type="checkbox" data-all="1"><b>Todos</b></label>'+opts.map(function(o,i){return '<label class="mi"><input type="checkbox" data-i="'+i+'"'+(sel.indexOf(o.v)>=0?' checked':'')+'>'+esc(o.t)+'</label>'}).join('');
  var all=p.querySelector('[data-all]');
  function upd(){var s=MS[id].sel;all.checked=!s.length;var t=opts.filter(function(o){return s.indexOf(o.v)>=0}).map(function(o){return o.t});b.textContent=(!s.length?'Todos':t.length<=2?t.join(', '):t.length+' selecionados')+' ▾'}
  b.onclick=function(e){e.stopPropagation();closeMs(id);p.classList.toggle('on')};
  p.onclick=function(e){e.stopPropagation()};
  p.onchange=function(e){var t=e.target;if(t.getAttribute('data-all')){Array.prototype.forEach.call(p.querySelectorAll('input[data-i]'),function(c){c.checked=false});MS[id].sel=[]}
    else MS[id].sel=Array.prototype.filter.call(p.querySelectorAll('input[data-i]'),function(c){return c.checked}).map(function(c){return opts[+c.getAttribute('data-i')].v});
    upd();cb()};
  upd()}
function limpar(ms,dates,cb){ms.forEach(function(id){var m=MS[id];m.sel=[];msMake(id,m.opts,m.cb)});dates.forEach(function(id){$(id).value=''});cb()}

/* ---------- login ---------- */
function logoHtml(el,logo,txt){if(logo){el.className=el.className.replace(/\s*img/,'')+' img';el.innerHTML='<img src="'+esc(logo)+'">'}else{el.className=el.className.replace(/\s*img/,'');el.textContent=txt}}
$('lBtn').onclick=entrar;$('lSenha').onkeydown=function(e){if(e.key==='Enter')entrar()};
function entrar(){$('lErr').textContent='';$('lBtn').disabled=true;
  google.script.run.withSuccessHandler(function(r){$('lBtn').disabled=false;if(r.err){$('lErr').textContent='❌ '+r.err;return}T=r.ok.token;iniciar()})
  .withFailureHandler(function(e){$('lBtn').disabled=false;$('lErr').textContent=e.message}).apiLogin($('lEmail').value,$('lSenha').value)}
function sair(exp){parent.postMessage({ccb:1,t:exp?'sessao':'sair'},'*')}
$('bSair').onclick=function(){sair()};
function iniciar(){call('boot').then(function(b){
  ME=b.user;CFG=b.cfg;SEMS=b.sems;OPC=b.opc;ADMIN=ME.perfil==='Admin';tema(ME.tema);
  $('login-screen').style.display='none';$('app').style.display='flex';cabecalho();
  var tabs=[['cc','📞 Call Center']];if(ADMIN){tabs.push(['ger','📊 Indicador — Geral']);tabs.push(['col','👤 Indicador — Colaborador'])}
  $('nav').innerHTML=tabs.map(function(t){return '<button class="tab-btn" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('nav').style.display=ADMIN?'flex':'none';
  Array.prototype.forEach.call($('nav').children,function(b){b.onclick=function(){abaAtiva(b.dataset.t)}});
  $('bCfg').onclick=abrirCfg;$('hAv').onclick=abrirCfg;TAB='cc';carregar()})}
window.__ccInit=function(m){T=m.token;iniciar()};
function cabecalho(){$('hNome').textContent=CFG.nomeSistema||'Call Center FIES';$('hUser').textContent=ME.nome;$('hRole').textContent=ADMIN?'Administrador':'Colaborador';$('hAv').innerHTML=avatar(ME.foto,ME.nome);$('hSem').textContent='Semestre: '+ME.semestre;logoHtml($('hLogo'),CFG.logo,'CC')}
function abaAtiva(t){TAB=t;Array.prototype.forEach.call($('nav').children,function(b){b.className='tab-btn'+(b.dataset.t===t?' active':'')});
  ['cc','ger','col'].forEach(function(v){$('v-'+v).className='tab-pane'+(v===t?' active':'')});if(D){if(t==='ger')renderGer();if(t==='col')renderCol()}}
function carregar(){call('getData',{sem:ME.semestre}).then(function(d){D=d;indexar();renderCC();abaAtiva(TAB)}).catch(function(e){D=null;$('v-cc').innerHTML='<div class="section-box"><b>Não foi possível carregar os dados deste semestre.</b><p class="muted" style="margin-top:6px">'+esc(e&&e.message?e.message:e)+'</p></div>';abaAtiva('cc')})}
function indexar(){D.rmap={};D.last={};D.regs.forEach(function(r){(D.rmap[r.cpf]=D.rmap[r.cpf]||[]).push(r);var l=D.last[r.cpf];if(!l||r.data>=l.data)D.last[r.cpf]=r});D.umap={};D.ufoto={};D.usuarios.concat(D.extras||[]).forEach(function(u){D.umap[u.email]=u.nome;D.ufoto[u.email]=u.foto})}

/* ---------- Call Center ---------- */
function dkey(s){var m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+m[2]+m[1]:String(s)}
function bancoOpts(k){var s={};D.alunos.forEach(function(a){if(a.banco&&a.banco[k])s[a.banco[k]]=1});return Object.keys(s).sort(function(x,y){return dkey(x)<dkey(y)?-1:1}).map(vt)}
function bancoSet(ini,fim){if(!ini.length&&!fim.length)return null;var o={};D.alunos.forEach(function(a){if(!a.banco)return;if(ini.length&&ini.indexOf(a.banco.ini)<0)return;if(fim.length&&fim.indexOf(a.banco.fim)<0)return;o[a.cpf]=1});return o}
function nrm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function renderCC(){
  var A=D.alunos,cursos=Object.keys(cnt(A,function(a){return a.curso})).sort(),colabs=Object.keys(cnt(D.regs,function(r){return r.colab}));
  $('v-cc').innerHTML='<div class="kpi-row">'+kpi('total','📋','kT','Total de alunos no<br>Call Center')+kpi('nao','⏳','kN','Solicitado /<br>Não aditou')+kpi('enviado','🏦','kE','Solicitado /<br>Enviado ao banco')+kpi('registros','📝','kR','Total de registros<br>realizados')+'</div>'+
  '<div class="filters-row"><div class="filter-group" style="min-width:220px"><label>Pesquisar aluno</label><input type="text" id="fQ" placeholder="🔍 Digite o nome do aluno..."></div><div class="filter-group"><label>Status</label><div id="fS"></div></div><div class="filter-group"><label>Curso</label><div id="fC"></div></div><div class="filter-group"><label>Responsável</label><div id="fR"></div></div><div class="filter-group"><label>Colaborador</label><div id="fB"></div></div><div class="filter-group"><label>Banco — data de início</label><div id="fBI"></div></div><div class="filter-group"><label>Banco — data final</label><div id="fBF"></div></div><button class="btn-clear" id="fX">✕ Limpar</button></div>'+
  (ADMIN?atrHtml():'')+'<div class="table-window"><div class="table-window-header"><h3>Lista de Alunos</h3><span class="table-count" id="tCount"></span></div><div class="table-scroll"><table><thead><tr><th>Status</th><th>Aluno</th><th>Curso / Turno</th><th>Comparecimento ao Banco</th><th>Contato</th><th>Resultado do contato</th><th>Observação</th><th>Responsável</th></tr></thead><tbody id="tb"></tbody></table></div></div>';
  msMake('fS',CC.map(vt),linhas);msMake('fC',cursos.map(vt),linhas);
  msMake('fR',[{v:'-',t:'Sem responsável'}].concat(D.usuarios.map(function(x){return {v:x.email,t:x.nome}})),linhas);
  msMake('fB',colabs.map(function(e){return {v:e,t:D.umap[e]||e}}),linhas);
  msMake('fBI',bancoOpts('ini'),linhas);msMake('fBF',bancoOpts('fim'),linhas);
  $('fQ').oninput=linhas;
  $('fX').onclick=function(){limpar(['fS','fC','fR','fB','fBI','fBF'],['fQ'],linhas)};if(ADMIN)atrIniciar();kpisCC();linhas()}
function kpisCC(){var A=D.alunos;$('kT').textContent=A.length;$('kN').textContent=A.filter(function(a){return a.status===CC[0]}).length;$('kE').textContent=A.filter(function(a){return a.status===CC[1]}).length;$('kR').textContent=D.regs.length}
function filtrados(){
  var s=msv('fS'),c=msv('fC'),r=msv('fR'),b=msv('fB'),bs=bancoSet(msv('fBI'),msv('fBF')),q=nrm($('fQ').value.trim()),qd=q.replace(/\D/g,'');
  return D.alunos.filter(function(a){
    if(q&&nrm(a.nome).indexOf(q)<0&&!(qd&&a.cpf.indexOf(qd)>=0))return false;
    if(s.length&&s.indexOf(a.status)<0)return false;if(c.length&&c.indexOf(a.curso)<0)return false;
    if(r.length&&!r.some(function(x){return x==='-'?!D.resp[a.cpf]:D.resp[a.cpf]===x}))return false;
    if(b.length&&!(D.rmap[a.cpf]||[]).some(function(x){return b.indexOf(x.colab)>=0}))return false;
    if(bs&&!bs[a.cpf])return false;return true});}
function linhas(){
  var L=filtrados();
  $('tb').innerHTML=L.map(function(a){var feito=(D.rmap[a.cpf]||[]).length>0,env=a.status===CC[1],ul=D.last[a.cpf];
    var banco=env?(a.banco?'<div class="banco-dates"><div><span class="d-label">Início </span>'+esc(a.banco.ini)+'</div>'+(a.banco.fim?'<div><span class="d-label">Fim </span>'+esc(a.banco.fim)+'</div>':'')+'</div>':'<span class="muted">Sem informação</span>'):'<span class="muted">—</span>';
    var res=ul?'<span class="res-tag">'+esc(ul.resultado)+'</span><div class="td-sub">'+ddmm(ul.data)+'</div>':'<span class="muted">—</span>';
    var ob=ul&&ul.obs?'<div class="obs-cell" title="'+esc(ul.obs)+'">'+esc(ul.obs)+'</div>':'<span class="muted">—</span>';
    return '<tr data-c="'+a.cpf+'"><td><span class="status-badge '+(env?'enviado':'nao')+'">'+esc(a.status)+'</span></td><td><div class="td-name">'+esc(a.nome)+'</div><div class="td-sub">CPF '+esc(a.cpfFmt)+'</div></td><td>'+esc(a.curso)+'<div class="td-sub">'+esc(a.turno)+'</div></td><td>'+banco+'</td><td><span class="contato-badge '+(feito?'sim':'nao')+'">'+(feito?'Sim':'Não')+'</span></td><td>'+res+'</td><td>'+ob+'</td><td><select class="resp-select" data-c="'+a.cpf+'"><option value="">—</option>'+D.usuarios.map(function(x){return '<option value="'+esc(x.email)+'"'+(D.resp[a.cpf]===x.email?' selected':'')+'>'+esc(x.nome)+'</option>'}).join('')+'</select></td></tr>'}).join('');
  $('tCount').textContent=L.length+' aluno(s)';
  if(!D.alunos.length&&D.diag)$('tCount').innerHTML='<b>Nenhum aluno com os status do Call Center.</b> Aba: '+esc(D.diag.aba)+' · linhas: '+D.diag.linhas+' · status na coluna AO: '+esc(JSON.stringify(D.diag.status));
  Array.prototype.forEach.call($('tb').querySelectorAll('tr'),function(tr){tr.onclick=function(e){if(e.target.tagName==='SELECT'||e.target.tagName==='OPTION')return;abrirAluno(tr.dataset.c)}});
  Array.prototype.forEach.call($('tb').querySelectorAll('select'),function(sl){sl.onchange=function(){D.resp[sl.dataset.c]=sl.value;atrAtualizar();call('setResp',{sem:ME.semestre,cpf:sl.dataset.c,email:sl.value}).then(function(){toast('Responsável atualizado.')})}});atrAtualizar()}

/* ---------- atribuição de responsáveis em lote (somente Admin) ---------- */
var ATR={aberto:false,plano:null,pessoas:{},grupos:{},gl:[],gc:{},campo:''};
try{ATR.aberto=localStorage.getItem('ccAtrAberto')==='1'}catch(e){}
function atrHtml(){
  return '<div class="section-box atr-box"><div class="atr-head" id="atrHead"><h3>👥 Atribuir responsáveis em lote</h3><span class="muted" id="atrRes"></span><button type="button" class="btn-secondary" id="atrTog"></button></div>'+
  '<div id="atrBody" style="display:none">'+
    '<p class="sh">Atua sobre os alunos que aparecem na lista abaixo. Use os filtros (Status, Curso, Responsável, Banco…) para escolher quem entra e depois distribua entre as pessoas.</p>'+
    '<div class="atr-sec"><div class="atr-lbl">1 · Quem recebe <a href="#" id="atrTodos">todos</a><a href="#" id="atrNenhum">nenhum</a></div><div class="atr-pessoas" id="atrPessoas"></div></div>'+
    '<div class="atr-sec"><div class="atr-lbl">2 · Como distribuir</div><div class="atr-modos">'+
      '<label class="atr-modo"><input type="radio" name="atrModo" value="igual" checked> Dividir igualmente <span class="muted">(alternando entre as pessoas)</span></label>'+
      '<label class="atr-modo"><input type="radio" name="atrModo" value="grupo"> Agrupar por <select id="atrGrupo"><option value="curso">Curso</option><option value="turno">Turno</option><option value="status">Status</option></select> <span class="muted">(cada grupo fica com uma pessoa)</span></label>'+
      '<div class="atr-grupos" id="atrGrupos" style="display:none"></div>'+
      '<label class="atr-modo"><input type="radio" name="atrModo" value="qtd"> Quantidade por pessoa <input type="number" id="atrQtd" min="1" value="20"> <span class="muted">alunos para cada uma, na ordem da lista</span></label>'+
      '<label class="atr-modo"><input type="radio" name="atrModo" value="remover"> Remover o responsável dos alunos da lista</label>'+
    '</div></div>'+
    '<div class="atr-sec atr-opts"><label><input type="checkbox" id="atrSo" checked> Somente alunos <b>sem responsável</b></label><label><input type="checkbox" id="atrCarga"> Equilibrar considerando os alunos que cada pessoa já tem</label></div>'+
    '<div class="atr-acoes"><button type="button" class="btn-secondary" id="atrPrev">👁 Ver prévia</button><button type="button" class="btn-primary" id="atrApl" disabled>✔ Aplicar</button><span class="muted" id="atrSt"></span></div>'+
    '<div id="atrPrevia"></div>'+
  '</div></div>';
}
function atrIniciar(){
  function abrir(){var b=$('atrBody');b.style.display=ATR.aberto?'':'none';$('atrTog').textContent=ATR.aberto?'Ocultar ▴':'Abrir ▾'}
  abrir();
  $('atrHead').onclick=function(){ATR.aberto=!ATR.aberto;try{localStorage.setItem('ccAtrAberto',ATR.aberto?'1':'0')}catch(e){}abrir()};
  $('atrTodos').onclick=function(e){e.preventDefault();e.stopPropagation();D.usuarios.forEach(function(u){ATR.pessoas[u.email]=true});atrPessoas();atrLimpaPlano()};
  $('atrNenhum').onclick=function(e){e.preventDefault();e.stopPropagation();ATR.pessoas={};atrPessoas();atrLimpaPlano()};
  Array.prototype.forEach.call(document.querySelectorAll('#atrBody input,#atrBody select'),function(x){if(x.id!=='atrPrev'&&x.id!=='atrApl')x.onchange=atrMudou});
  $('atrQtd').oninput=atrLimpaPlano;
  atrGruposRender();
  $('atrPrev').onclick=atrPrevia;$('atrApl').onclick=atrAplicar;
  atrPessoas();
}
function atrCarga(){var c={};Object.keys(D.resp).forEach(function(k){if(D.resp[k])c[D.resp[k]]=(c[D.resp[k]]||0)+1});return c}
function atrPessoas(){
  var c=atrCarga();
  $('atrPessoas').innerHTML=D.usuarios.map(function(u){return '<label class="atr-chip'+(ATR.pessoas[u.email]?' on':'')+'"><input type="checkbox" data-e="'+esc(u.email)+'"'+(ATR.pessoas[u.email]?' checked':'')+'> '+esc(u.nome)+' <small>('+(c[u.email]||0)+')</small></label>'}).join('')||'<span class="muted">Nenhum usuário com acesso ao Call Center.</span>';
  Array.prototype.forEach.call($('atrPessoas').querySelectorAll('input'),function(x){x.onchange=function(){if(x.checked)ATR.pessoas[x.getAttribute('data-e')]=true;else delete ATR.pessoas[x.getAttribute('data-e')];x.parentNode.className='atr-chip'+(x.checked?' on':'');atrLimpaPlano()}});
}
function atrLimpaPlano(){
  ATR.plano=null;
  if($('atrApl'))$('atrApl').disabled=true;
  if($('atrPrevia'))$('atrPrevia').innerHTML='';
}
function atrAtualizar(){          // chamada a cada atualização da lista
  if(!ADMIN||!$('atrRes'))return;
  var L=filtrados();
  $('atrRes').textContent=L.length+' aluno(s) na lista · '+L.filter(function(a){return !D.resp[a.cpf]}).length+' sem responsável';
  atrPessoas();atrGruposRender();atrLimpaPlano();
}
function atrModo(){return document.querySelector('input[name=atrModo]:checked').value}
function atrAlvo(){var so=$('atrSo').checked;return filtrados().filter(function(a){return !so||!D.resp[a.cpf]})}
function atrMudou(){atrGruposRender();atrLimpaPlano()}
var ATR_ROT={curso:'cursos',turno:'turnos',status:'status'};
// Lista os valores existentes (cursos, turnos ou status) entre os alunos que entram, para marcar e escolher o responsável de cada um
function atrGruposRender(){
  var box=$('atrGrupos');if(!box)return;
  if(atrModo()!=='grupo'){box.style.display='none';return}
  box.style.display='';
  var campo=$('atrGrupo').value;
  if(ATR.campo!==campo){ATR.campo=campo;ATR.grupos={}}
  var cnt={};atrAlvo().forEach(function(a){var k=String(a[campo]||'—');cnt[k]=(cnt[k]||0)+1});
  var keys=Object.keys(cnt).sort(function(x,y){return cnt[y]-cnt[x]||x.localeCompare(y,'pt')});
  ATR.gl=keys;ATR.gc=cnt;
  keys.forEach(function(k){if(!ATR.grupos[k])ATR.grupos[k]={on:true,resp:''}});
  if(!keys.length){box.innerHTML='<span class="muted">Nenhum aluno entra com os filtros atuais.</span>';return}
  var opts=function(sel){return '<option value="">Automático</option>'+D.usuarios.map(function(u){return '<option value="'+esc(u.email)+'"'+(sel===u.email?' selected':'')+'>'+esc(u.nome)+'</option>'}).join('')};
  box.innerHTML='<div class="atr-gcab"><span class="atr-lbl">Escolha os '+ATR_ROT[campo]+' <a href="#" id="atrGAll">todos</a><a href="#" id="atrGNone">nenhum</a></span>'+
    '<span class="atr-gdef">Definir o responsável dos marcados: <select id="atrGBulk">'+opts('')+'</select> <button type="button" class="btn-secondary" id="atrGSet">Definir</button></span></div>'+
    keys.map(function(k,i){var g=ATR.grupos[k];
      return '<div class="atr-grow"><label class="atr-gnome"><input type="checkbox" data-i="'+i+'"'+(g.on?' checked':'')+'> <span>'+esc(k)+'</span> <small>('+cnt[k]+' aluno(s))</small></label>'+
             '<select data-i="'+i+'">'+opts(g.resp)+'</select></div>'}).join('')+
    '<div class="muted" id="atrGRes"></div><div class="muted">“Automático”: o sistema equilibra entre as pessoas marcadas em “Quem recebe”.</div>';
  Array.prototype.forEach.call(box.querySelectorAll('input[data-i]'),function(x){x.onchange=function(){atrGMarca(+x.getAttribute('data-i'),x.checked)}});
  Array.prototype.forEach.call(box.querySelectorAll('select[data-i]'),function(x){x.onchange=function(){atrGResp(+x.getAttribute('data-i'),x.value)}});

// Monta o plano de distribuição {passos:[{email,nome,cpfs,det,antes}], total, sobra, ignorados} ou {erro}
function atrPlano(){
  var modo=atrModo(),L=filtrados();
  if(modo==='remover'){
    var rem=L.filter(function(a){return D.resp[a.cpf]});
    if(!rem.length)return {erro:'Nenhum aluno da lista tem responsável.'};
    return {modo:modo,passos:[{email:'',nome:'(sem responsável)',cpfs:rem.map(function(a){return a.cpf}),det:'',antes:0}],total:rem.length,sobra:0,ignorados:0};
  }
  var pessoas=D.usuarios.filter(function(u){return ATR.pessoas[u.email]});
  var alvo=atrAlvo();
  if(!alvo.length)return {erro:'Nenhum aluno da lista se encaixa (confira os filtros e a opção "somente alunos sem responsável").'};
  var campo=$('atrGrupo').value,gr={},sel=[],ignorados=0;
  if(modo==='grupo'){
    alvo.forEach(function(a){var k=String(a[campo]||'—');(gr[k]=gr[k]||[]).push(a.cpf)});
    sel=Object.keys(gr).filter(function(k){var g=ATR.grupos[k];return !g||g.on!==false});
    if(!sel.length)return {erro:'Marque ao menos um grupo na lista de '+ATR_ROT[campo]+'.'};
    ignorados=alvo.length-sel.reduce(function(s,k){return s+gr[k].length},0);
    var fixo=function(k){var e=ATR.grupos[k]&&ATR.grupos[k].resp;return e&&D.usuarios.some(function(u){return u.email===e})?e:''};
    if(sel.some(function(k){return !fixo(k)})&&!pessoas.length)return {erro:'Há grupos em "Automático": marque pessoas em "Quem recebe" ou escolha o responsável de cada grupo.'};
    alvo=alvo.filter(function(a){return sel.indexOf(String(a[campo]||'—'))>=0});
  }else if(!pessoas.length)return {erro:'Marque ao menos uma pessoa em "Quem recebe".'};
  var envol=pessoas.slice();                                   // marcadas + responsáveis escolhidos nos grupos
  if(modo==='grupo')sel.forEach(function(k){var e=fixo(k);if(e&&!envol.some(function(u){return u.email===e}))envol.push(D.usuarios.filter(function(u){return u.email===e})[0])});
  var emAlvo={};alvo.forEach(function(a){emAlvo[a.cpf]=1});
  var base={},peso={},por={},det={};
  envol.forEach(function(u){base[u.email]=0;por[u.email]=[];det[u.email]={}});
  D.alunos.forEach(function(a){if(!emAlvo[a.cpf]&&base[D.resp[a.cpf]]!==undefined)base[D.resp[a.cpf]]++});   // o que a pessoa já tem e não será mexido
  envol.forEach(function(u){peso[u.email]=$('atrCarga').checked?base[u.email]:0});
  function menor(){var b=pessoas[0];pessoas.forEach(function(u){if(peso[u.email]+por[u.email].length<peso[b.email]+por[b.email].length)b=u});return b}
  var sobra=0;
  if(modo==='igual'){
    alvo.forEach(function(a){por[menor().email].push(a.cpf)});
  }else if(modo==='grupo'){
    var ord=sel.slice().sort(function(x,y){return gr[y].length-gr[x].length||x.localeCompare(y,'pt')});
    ord.filter(fixo).forEach(function(k){var e=fixo(k);Array.prototype.push.apply(por[e],gr[k]);det[e][k]=gr[k].length});          // escolhidos à mão primeiro
    ord.filter(function(k){return !fixo(k)}).forEach(function(k){var u=menor();Array.prototype.push.apply(por[u.email],gr[k]);det[u.email][k]=gr[k].length});   // o resto, equilibrado
  }else{        // qtd
    var n=Math.max(1,parseInt($('atrQtd').value,10)||0),i=0;
    pessoas.forEach(function(u){por[u.email]=alvo.slice(i,i+n).map(function(a){return a.cpf});i+=n});
    sobra=Math.max(0,alvo.length-i);
  }
  var passos=envol.filter(function(u){return por[u.email].length}).map(function(u){
    return {email:u.email,nome:u.nome,cpfs:por[u.email],antes:base[u.email],det:Object.keys(det[u.email]).map(function(k){return k+' ('+det[u.email][k]+')'}).join(', ')};
  });
  return {modo:modo,passos:passos,total:passos.reduce(function(s,p){return s+p.cpfs.length},0),sobra:sobra,ignorados:ignorados};
}
function atrPrevia(){
  var p=atrPlano();atrLimpaPlano();

function atrAplicar(){
  var p=ATR.plano;if(!p||!p.passos.length)return;
  var rem=p.modo==='remover';
  if(!confirm(rem?'Remover o responsável de '+p.total+' aluno(s)?':'Atribuir '+p.total+' aluno(s) a '+p.passos.length+' pessoa(s)?'))return;
  $('atrApl').disabled=true;$('atrPrev').disabled=true;
  var feitos=0;
  function fim(ok,msg){$('atrPrev').disabled=false;if(ok){linhas();$('atrSt').textContent='✔ '+feitos+' aluno(s) '+(rem?'sem responsável':'atribuído(s)')+'.';toast(rem?'Responsáveis removidos.':'Responsáveis atribuídos.')}else{$('atrApl').disabled=false;$('atrSt').textContent='';toast(msg||'Falha ao atribuir.','err')}}
  (function passo(i){
    if(i>=p.passos.length){fim(true);return}
    var s=p.passos[i],partes=[];
    for(var k=0;k<s.cpfs.length;k+=2000)partes.push(s.cpfs.slice(k,k+2000));
    $('atrSt').textContent='Aplicando '+(i+1)+' de '+p.passos.length+'…';
    (function parte(j){
      if(j>=partes.length){passo(i+1);return}
      call('setRespLote',{sem:ME.semestre,cpfs:partes[j],email:s.email}).then(function(){
        partes[j].forEach(function(c){if(s.email)D.resp[c]=s.email;else delete D.resp[c]});feitos+=partes[j].length;parte(j+1);
      }).catch(function(e){fim(false,(e&&e.message)||String(e))});
    })(0);
  })(0);
}

  var cu=cnt(L,function(x){return x[1]}),top=Object.keys(cu).sort(function(a,b){return cu[b]-cu[a]}).slice(0,10);chart('gc3','bar',top,[{l:'Alunos',d:top.map(function(k){return cu[k]})}]);
  var tu=cnt(L,function(x){return x[2]||'(vazio)'}),tk=Object.keys(tu);chart('gc4','pie',tk,[{l:'Alunos',d:tk.map(function(k){return tu[k]})}])}
function gDia(){var R=filtroData(D.regs,msv('dM'),$('dI').value,$('dF').value,$('dE').value),c=cnt(R,function(r){return r.data.slice(0,10)}),k=Object.keys(c).sort();chart('gc5','bar',k.map(ddmm),[{l:'Registros',d:k.map(function(x){return c[x]})}])}
function gRes(){var st=msv('rSt'),rs=msv('rRs');
  var R=filtroData(D.regs,msv('rMs'),$('rI').value,$('rF').value,$('rE').value).filter(function(r){return(!st.length||st.indexOf(r.status)>=0)&&(!rs.length||rs.indexOf(r.resultado)>=0)});
  var c=cnt(R,function(r){return r.resultado}),k=Object.keys(c);chart('gc6','bar',k,[{l:'Total',d:k.map(function(x){return c[x]})}]);chart('gc7','pie',k,[{l:'Total',d:k.map(function(x){return c[x]})}]);
  var dias=Object.keys(cnt(R,function(r){return r.data.slice(0,10)})).sort(),m={};R.forEach(function(r){var d=r.data.slice(0,10);m[d]=m[d]||{};m[d][r.resultado]=(m[d][r.resultado]||0)+1});
  $('piv').innerHTML=pivot(dias.map(ddmm),dias.map(function(d){return m[d]}),k,'Data')}

/* ---------- Indicador - Colaborador ---------- */
function renderCol(){
  if(!D)return;var meses=Object.keys(cnt(D.regs,function(r){return r.data.slice(0,7)})).sort();
  $('v-col').innerHTML='<div class="filters-row">'+fms('cM','Mês')+fdate('cI','Data inicial')+fdate('cF','Data final')+fms('cB','Colaborador')+fms('cBI','Banco — data de início')+fms('cBF','Banco — data final')+'<button class="btn-clear" id="cX">✕ Limpar</button></div>'+
  '<div class="colab-grid" id="cK"></div>'+
  '<div class="grid2">'+box('cc1','📊 Comparativo por Colaborador','Contatos realizados por colaborador')+box('cc2','📞 Resultado por colaborador','Distribuição dos resultados registrados')+'</div>'+
  '<div class="grid2">'+box('cc3','👥 Alunos por responsável','Divisão da carteira de alunos')+box('cc4','📅 Registros por dia','Evolução diária na seleção')+'</div>'+
  '<div class="section-box"><h3>📋 Tabela Detalhada por Colaborador</h3><p class="sh">Responsabilidades, contatos e resultados</p><div id="cT"></div></div>'+
  '<div class="section-box"><h3>🗓️ Registros por colaborador e dia</h3><div id="cP"></div></div>';
  msMake('cM',mesOpts(meses),cAtu);msMake('cB',D.usuarios.map(function(u){return {v:u.email,t:u.nome}}),cAtu);msMake('cBI',bancoOpts('ini'),cAtu);msMake('cBF',bancoOpts('fim'),cAtu);
  ['cI','cF'].forEach(function(i){$(i).onchange=cAtu});$('cX').onclick=function(){limpar(['cM','cB','cBI','cBF'],['cI','cF'],cAtu)};cAtu()}
function cAtu(){var cb=msv('cB'),nm=function(e){return D.umap[e]||e},bs=bancoSet(msv('cBI'),msv('cBF'));
  var R=filtroData(D.regs,msv('cM'),$('cI').value,$('cF').value).filter(function(r){return(!cb.length||cb.indexOf(r.colab)>=0)&&(!bs||bs[r.cpf])});
  var respN=cnt(Object.keys(D.resp).filter(function(c){return D.resp[c]&&(!bs||bs[c])}),function(c){return D.resp[c]});
  var us=D.usuarios.filter(function(u){return!cb.length||cb.indexOf(u.email)>=0});
  var res=OPC.Resultado;
  $('cK').innerHTML=us.map(function(u){var mine=R.filter(function(r){return r.colab===u.email}),rc=cnt(mine,function(r){return r.resultado});
    return '<div class="colab-card"><div class="cc-name"><span class="cc-avatar">'+avatar(u.foto,u.nome)+'</span>'+esc(u.nome)+'</div><div class="colab-stat"><span class="cs-lbl">Responsável por</span><span class="cs-val">'+(respN[u.email]||0)+' aluno(s)</span></div><div class="colab-stat"><span class="cs-lbl">Contatos realizados</span><span class="cs-val">'+mine.length+'</span></div>'+
    res.map(function(x){return '<div class="colab-stat"><span class="cs-lbl">'+esc(x)+'</span><span class="cs-val">'+(rc[x]||0)+'</span></div>'}).join('')+'</div>'}).join('')||'<p class="muted">Sem usuários na seleção.</p>';
  var ks=us.map(function(u){return u.nome});
  chart('cc1','bar',ks,[{l:'Contatos',d:us.map(function(u){return R.filter(function(r){return r.colab===u.email}).length})}]);
  chart('cc2','bar',ks,res.map(function(rs){return {l:rs,d:us.map(function(u){return R.filter(function(r){return r.colab===u.email&&r.resultado===rs}).length})}}),true);
  var ru=us.filter(function(u){return respN[u.email]});chart('cc3','pie',ru.map(function(u){return u.nome}),[{l:'Alunos',d:ru.map(function(u){return respN[u.email]})}]);
  var dias=Object.keys(cnt(R,function(r){return r.data.slice(0,10)})).sort(),m={};R.forEach(function(r){var d=r.data.slice(0,10);m[d]=m[d]||{};m[d][nm(r.colab)]=(m[d][nm(r.colab)]||0)+1});
  chart('cc4','bar',dias.map(ddmm),[{l:'Registros',d:dias.map(function(d){return Object.keys(m[d]).reduce(function(s,k){return s+m[d][k]},0)})}]);
  var rowsT=us.map(function(u){var o={'Responsável por':respN[u.email]||0,'Contatos':R.filter(function(r){return r.colab===u.email}).length};res.forEach(function(rs){o[rs]=R.filter(function(r){return r.colab===u.email&&r.resultado===rs}).length});return o});
  var cols=['Responsável por','Contatos'].concat(res);
  $('cT').innerHTML=us.length?'<div class="dyn-wrap"><table class="dyn-table"><thead><tr><th>Colaborador</th>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+us.map(function(u,i){return '<tr><td>'+esc(u.nome)+'</td>'+cols.map(function(c){return '<td class="num">'+rowsT[i][c]+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>':'<p class="muted">Sem dados.</p>';
  $('cP').innerHTML=pivot(dias.map(ddmm),dias.map(function(d){return m[d]}),Object.keys(cnt(R,function(r){return nm(r.colab)})),'Data')}

/* ---------- Configurações ---------- */
function abrirCfg(){
  var itens=[['sem','📅','Semestre'],['tema','🎨','Tema'],['trocper','⇄','Trocar de semestre'],['trocsis','⇄','Trocar de sistema']];
  var adm=[['opc','📋','Opções de Registro'],['marca','🏷️','Logo e Nome'],['semcad','🔄','Troca de Semestre']];
  function it(i,k){return '<div class="sn-item'+(k===0?' active':'')+'" data-k="'+i[0]+'"><span>'+i[1]+'</span> '+i[2]+'</div>'}
  var o=ov('<button class="settings-close">✕</button><nav class="settings-nav"><div class="sn-title">Configurações</div>'+itens.map(it).join('')+(ADMIN?'<div class="sn-divider"></div><div class="sn-admin-label">Admin</div>'+adm.map(it).join(''):'')+'</nav><div class="settings-body" id="cb"></div>','settings-panel','side');
  o.querySelector('.settings-close').onclick=function(){o.remove()};
  var bd=o.querySelector('#cb');
  Array.prototype.forEach.call(o.querySelectorAll('.sn-item'),function(b){b.onclick=function(){Array.prototype.forEach.call(o.querySelectorAll('.sn-item'),function(x){x.classList.remove('active')});b.classList.add('active');cfgTela(b.dataset.k,bd,o)}});
  cfgTela('sem',bd,o)}
function irPara(t,o){o.remove();parent.postMessage({ccb:1,t:t},'*')}
function cfgTela(k,bd,o){if(k==='trocper'){irPara('periodo',o);return}if(k==='trocsis'){irPara('sistema',o);return}({sem:tSem,tema:tTema,opc:tOpc,marca:tMarca,semcad:tSemCad})[k](bd,o)}
function lerImg(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){cb(im)};im.src=r.result};r.readAsDataURL(file)}
function tSem(bd,o){bd.innerHTML='<h2>Semestre Ativo</h2><p class="sb-desc">Selecione o semestre que está sendo trabalhado no momento.</p><div class="semester-cards">'+SEMS.map(function(s){return '<div class="semester-card'+(s===ME.semestre?' active':'')+'" data-s="'+esc(s)+'">'+esc(s)+'</div>'}).join('')+'</div>';
  Array.prototype.forEach.call(bd.querySelectorAll('.semester-card'),function(c){c.onclick=function(){var s=c.dataset.s;call('setSem',{sem:s}).then(function(){ME.semestre=s;$('hSem').textContent='Semestre: '+s;o.remove();carregar();toast('Semestre alterado para '+s)})}})}
function tTema(bd){var esc_=ME.tema==='Tema Escuro';bd.innerHTML='<h2>Tema do Sistema</h2><p class="sb-desc">Escolha entre o tema padrão (claro) ou o tema escuro.</p><div class="theme-btns"><div class="theme-btn'+(esc_?'':' active')+'" data-t="Padrão"><span class="tb-icon">☀️</span><span class="tb-label">Padrão</span></div><div class="theme-btn'+(esc_?' active':'')+'" data-t="Tema Escuro"><span class="tb-icon">🌙</span><span class="tb-label">Tema Escuro</span></div></div>';
  Array.prototype.forEach.call(bd.querySelectorAll('.theme-btn'),function(b){b.onclick=function(){call('setTema',{tema:b.dataset.t}).then(function(){ME.tema=b.dataset.t;tema(b.dataset.t);tTema(bd);if(D&&ADMIN){if(TAB==='ger')renderGer();if(TAB==='col')renderCol()}})}})}
function tOpc(bd){var T3=[['Objetivo','Objetivo do Contato'],['Meio','Meio de Comunicação'],['Resultado','Resultado do Contato']];
  bd.innerHTML='<h2>Opções de Registro</h2><p class="sb-desc">Gerencie as opções disponíveis nos campos de registro de contato.</p>'+T3.map(function(t){return '<div><div class="lbl">'+t[1]+'</div><div class="opts-list">'+OPC[t[0]].map(function(v){return '<div class="opt-item"><span>'+esc(v)+'</span><button class="btn-del" title="Excluir" data-d="'+t[0]+'" data-v="'+esc(v)+'">🗑️</button></div>'}).join('')+'</div><div class="add-opt-row"><input id="n'+t[0]+'" placeholder="Nova opção..."><button class="btn-primary" data-a="'+t[0]+'">+ Adicionar</button></div></div>'}).join('');
  Array.prototype.forEach.call(bd.querySelectorAll('button[data-a]'),function(b){b.onclick=function(){call('opcAdd',{tipo:b.dataset.a,valor:$('n'+b.dataset.a).value.trim()}).then(function(x){OPC=x;tOpc(bd)})}});
  Array.prototype.forEach.call(bd.querySelectorAll('button[data-d]'),function(b){b.onclick=function(){if(confirm('Excluir "'+b.dataset.v+'"? Registros antigos continuam com esse texto.'))call('opcDel',{tipo:b.dataset.d,valor:b.dataset.v}).then(function(x){OPC=x;tOpc(bd)})}})}
function tMarca(bd){
  var dLogo=CFG.logo||'';
  bd.innerHTML='<h2>Logo e Nome do Sistema</h2><p class="sb-desc">A logo e o nome aparecem no cabeçalho do Call Center.</p>'+
    '<div><div class="lbl">Prévia — cabeçalho</div><div class="header" style="position:static;border:1px solid var(--border);border-radius:10px"><div class="header-brand"><div class="header-logo" id="pvLogo"></div><div><div class="header-name" id="pvNome"></div></div></div></div></div>'+
    '<div><div class="lbl">Logo do Sistema</div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="btn-secondary" style="cursor:pointer">📁 Carregar Logo<input type="file" id="lf" accept="image/*" style="display:none"></label><button class="btn-secondary" id="lx">Remover logo</button></div></div>'+
    '<div class="form-field"><label>Nome do sistema (exibido no cabeçalho)</label><input id="n2" maxlength="60" value="'+esc(CFG.nomeSistema)+'"></div>'+
    '<button class="btn-primary" id="s2">💾 Salvar</button>';
  function pv(){logoHtml($('pvLogo'),dLogo,'CC');$('pvNome').textContent=$('n2').value.trim()||'Call Center FIES'}
  pv();
  $('n2').oninput=pv;
  $('lx').onclick=function(){dLogo='';pv()};
  $('lf').onchange=function(){if(!this.files[0])return;lerImg(this.files[0],function(im){var k=Math.min(1,320/im.width,100/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);dLogo=c.toDataURL('image/png');pv()})};
  $('s2').onclick=function(){
    var nome=$('n2').value.trim();
    if(!nome){toast('Informe o nome do sistema.','err');return}
    var passos=[];
    if(dLogo!==(CFG.logo||''))passos.push(['logo',dLogo]);
    if(nome!==String(CFG.nomeSistema||''))passos.push(['nomeSistema',nome]);
    if(!passos.length){toast('Nada para salvar.');return}
    (function prox(i){
      if(i>=passos.length){cabecalho();tMarca(bd);toast('Salvo.');return}
      call('cfgSave',{chave:passos[i][0],valor:passos[i][1]}).then(function(c){CFG=c;prox(i+1)});
    })(0);
  };
}
function tSemCad(bd,o){call('semList').then(function(L){
  bd.innerHTML='<h2>Troca de Semestre / Planilhas</h2><p class=\"sb-desc\">Cadastre ou edite as planilhas de cada semestre. Cada semestre pode ter a sua própria planilha de registros: o sistema cria as abas e os cabeçalhos sozinho.</p><div style=\"overflow-x:auto\"><table class=\"users-table\"><thead><tr><th>Semestre</th><th>Base geral</th><th>Call Center</th><th>Registros</th><th>Ações</th></tr></thead><tbody>'+L.map(function(s,i){return '<tr><td><b>'+esc(s.sem)+'</b></td><td>'+(s.base?'✔ configurada':'—')+'</td><td>'+(s.cc?'✔ configurada':'—')+'</td><td>'+(s.reg?'✔ planilha própria':'Planilha principal')+(s.legado?'<div style=\"font-size:11px;color:#b45309\">⚠️ '+s.legado+' registro(s) antigo(s) continuam na planilha principal</div>':'')+'</td><td><button class=\"btn-icon-sm edit\" data-e=\"'+i+'\">✏️</button> <button class=\"btn-icon-sm del\" data-x=\"'+i+'\">🗑️</button></td></tr>'}).join('')+'</tbody></table></div>'+
  '<div class=\"form-field\"><label>Semestre (ex.: 2027.1)</label><input id=\"xs\"></div><div class=\"form-field\"><label>Link ou ID da planilha — Base Geral (aba 1)</label><input id=\"xb\" placeholder=\"Cole o link ou ID da planilha\"></div><div class=\"form-field\"><label>Link ou ID da planilha — Call Center / Aditamentos (aba \"Aditamento\")</label><input id=\"xc\" placeholder=\"Cole o link ou ID da planilha\"></div><div class=\"form-field\"><label>Link ou ID da planilha — Registros deste semestre (onde os novos dados serão salvos)</label><input id=\"xr\" placeholder=\"Cole o link ou ID de uma planilha vazia (vazio = planilha principal)\"></div><div class=\"warn-box\">⚠️ Ao informar a planilha de Registros, o sistema cria nela as abas REGISTROS e RESPONSAVEIS com as colunas já nomeadas. Use uma planilha nova e dê acesso de editor à conta que executa o script. Registros que já estão em outra planilha não são movidos. Ao salvar um semestre existente, os links dele são substituídos.</div><button class=\"btn-primary\" id=\"xk\">🔄 Salvar semestre</button>';
  Array.prototype.forEach.call(bd.querySelectorAll('[data-e]'),function(b){b.onclick=function(){var s=L[b.dataset.e];$('xs').value=s.sem;$('xb').value=s.base;$('xc').value=s.cc;$('xr').value=s.reg||''}});
  Array.prototype.forEach.call(bd.querySelectorAll('[data-x]'),function(b){b.onclick=function(){var s=L[b.dataset.x];if(confirm('Excluir o semestre '+s.sem+'? Os registros já feitos permanecem na aba REGISTROS.'))call('semDel',{sem:s.sem}).then(function(){SEMS=SEMS.filter(function(x){return x!==s.sem});tSemCad(bd,o)})}});
  $('xk').onclick=function(){call('semSave',{sem:$('xs').value,base:$('xb').value,cc:$('xc').value,reg:$('xr').value}).then(function(l){SEMS=l.map(function(x){return x.sem});toast('Semestre salvo.');tSemCad(bd,o)})}})}
parent.postMessage({ccb:1,t:'pronto'},'*');
</script>
