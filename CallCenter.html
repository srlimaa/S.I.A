<!-- Abas: Call Center (todos); Indicador Geral e Indicador Colaborador (só Admin). Estilos em cc_css e código em cc_js. -->
<!DOCTYPE html>

<base target="_top">
<script>
// Ponte: substitui google.script.run dentro do iframe por mensagens (postMessage) ao sistema pai.
// O mapa traduz api > ccApi, apiLogout > ccApiLogout, apiLogin > ccApiLogin e getPublic > ccGetPublic.
/* Ponte com o sistema principal: este arquivo roda dentro de um iframe e as chamadas ao servidor passam pelo sistema pai */
(function(){
  var pend={},n=0,MAP={api:'ccApi',apiLogout:'ccApiLogout',apiLogin:'ccApiLogin',getPublic:'ccGetPublic'};
  window.addEventListener('message',function(e){
    var m=e.data;if(!m||!m.ccb||e.source!==parent)return;
    if(m.t==='res'){var p=pend[m.id];if(!p)return;delete pend[m.id];if(m.erro)p.fail({message:m.erro});else p.ok(m.ok);}
    else if(m.t==='init'&&window.__ccInit)window.__ccInit(m);
  });
  function mk(){
    var ok=function(){},fail=function(){},px,o={withSuccessHandler:function(f){ok=f;return px},withFailureHandler:function(f){fail=f;return px}};
    px=new Proxy(o,{get:function(t,k){
      if(k in t)return t[k];
      return function(){var id=++n;pend[id]={ok:ok,fail:fail};parent.postMessage({ccb:1,t:'call',id:id,fn:MAP[k]||k,args:[].slice.call(arguments)},'*');};
    }});
    return px;
  }
  window.google={script:{get run(){return mk();}}};
})();
</script>
